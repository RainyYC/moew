<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoE Judge · 判题台（设计稿）</title>
<style>
:root{
  --bg:#f4f7fa; --panel:#ffffff; --panel2:#f7f9fc; --panel3:#eef2f7;
  --line:#e2e8f0; --line2:#cfd9e4;
  --fg:#0e1620; --dim:#465a70; --faint:#6d8098;
  --ok:#0f9d58; --bad:#d92d20; --warn:#b45309; --accent:#2563eb;
  --comp:#f2ab3c; --compb:#f8dfb1; --comm:#3fb3c8; --commb:#bfe7ee;
  --zero:#8194a8; --act:#7c5cbf;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  --sans:"Inter","HarmonyOS Sans","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --hatch:repeating-linear-gradient(45deg,rgba(0,0,0,.09) 0 1.5px,transparent 1.5px 5px);
}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;line-height:1.5;
  background-image:radial-gradient(1100px 400px at 16% -10%,#e8eef7 0%,transparent 64%);
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
kbd{font-family:var(--mono);font-size:10px;padding:1px 4px;border:1px solid var(--line2);
  border-radius:4px;color:var(--dim)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* 顶栏 */
.topbar{display:flex;align-items:center;gap:16px;height:50px;padding:0 15px;flex-shrink:0;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,#ffffff,#f7f9fc)}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:.015em;font-size:13.5px}
.brand .mark{width:23px;height:23px;border-radius:6px;display:grid;place-items:center;
  background:linear-gradient(150deg,#eef4fb,#dce6f2);border:1px solid var(--line2)}
.brand .mark svg{width:13px;height:13px}
.brand .ver{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.04em;
  border:1px solid var(--line2);border-radius:999px;padding:1px 6px}
.casebar{display:flex;align-items:center;gap:5px}
.case-tab{padding:5px 11px;border-radius:7px;color:var(--dim);border:1px solid transparent;
  font-size:12.5px;white-space:nowrap}
.case-tab:hover{color:var(--fg);background:#eef2f8}
.case-tab[aria-selected="true"]{color:#fff;background:#1b2431;font-weight:600}
.case-meta{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:6px;white-space:nowrap}
.actions{margin-left:auto;display:flex;align-items:center;gap:7px}
.btn{padding:6px 12px;border-radius:7px;border:1px solid var(--line2);color:var(--dim);font-size:12.5px}
.btn:hover{color:var(--fg);border-color:#9db0c4;background:#f7f9fc}
.btn.primary{background:#1b2431;color:#fff;border-color:transparent;font-weight:600}
.btn.primary:hover{background:#0d1622}

/* 文件条 */
.iobar{display:flex;align-items:center;gap:9px;padding:8px 15px;flex-shrink:0;
  border-bottom:1px solid var(--line);background:var(--panel)}
.file{display:flex;align-items:center;gap:7px;padding:4px 9px;border-radius:6px;
  background:var(--panel2);border:1px solid var(--line2);font-family:var(--mono);font-size:11px}
.file .dot{width:5px;height:5px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 2px rgba(15,157,88,.16)}
.file small{color:var(--faint);font-family:var(--sans);font-size:10px}
.iobar .spacer{margin-left:auto}
.tog{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px;
  padding:3px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2)}
.tog input{accent-color:var(--accent);margin:0;width:12px;height:12px}
.tog select{background:transparent;border:none;color:var(--fg);font-family:var(--mono);
  font-size:11px;outline:none}
.tog select option{background:#fff;color:#0f1720}

/* 判分条 */
.verdict{display:flex;align-items:center;gap:22px;padding:13px 18px;flex-shrink:0;
  border-bottom:1px solid var(--line);
  background:linear-gradient(94deg,#eefaf3 0%,#fbfcfd 42%,#fbfcfd 100%)}
.verdict[data-state="bad"]{background:linear-gradient(94deg,#fdf0ef 0%,#fbfcfd 42%,#fbfcfd 100%)}
.vbadge{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;
  font-weight:650;font-size:12px;letter-spacing:.03em;border:1px solid;white-space:nowrap}
.verdict[data-state="ok"] .vbadge{color:#0b7a45;border-color:rgba(15,157,88,.3);
  background:rgba(15,157,88,.09)}
.verdict[data-state="bad"] .vbadge{color:#b42317;border-color:rgba(217,45,32,.32);
  background:rgba(217,45,32,.08)}
.vbadge svg{width:14px;height:14px}
.vcol{display:flex;flex-direction:column;gap:3px}
.vhead{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.vrow{display:flex;align-items:baseline;gap:7px}
.vtime{font-family:var(--mono);font-size:34px;line-height:.95;font-weight:600;
  letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.verdict[data-state="bad"] .vtime{color:var(--faint);text-decoration:line-through}
.vunit{font-size:10.5px;color:var(--faint)}
.vdiff{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px;width:fit-content}
.vdiff.flat{color:var(--dim);background:#eef2f7}
.vdiff.better{color:#0b7a45;background:rgba(15,157,88,.1)}
.vdiff.worse{color:#b42317;background:rgba(217,45,32,.1)}
.vstats{display:flex;gap:24px;padding-left:6px}
.stat .k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
  white-space:nowrap}
.stat .v{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:10px;color:var(--faint);margin-left:2px}
.vbars{width:210px;margin-left:auto;display:flex;flex-direction:column;gap:5px}
.vbar-row{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;
  color:var(--faint)}
.vbar-row .cap{width:24px;text-align:right;letter-spacing:.02em}
.vbar{position:relative;flex:1;height:7px;border-radius:4px;background:#e8eef5;overflow:hidden}
.vbar i{position:absolute;inset:0 auto 0 0;border-radius:4px;display:block}
.vbar i.lb{background:var(--accent);opacity:.9}
.vbar i.tm{background:linear-gradient(90deg,var(--comp),var(--comm));opacity:.95}
.vbar-row .val{width:34px;text-align:right;color:var(--dim)}
.vnote{font-size:9.5px;color:var(--faint);text-align:right;line-height:1.4}

/* 主网格 */
.grid{flex:1;display:grid;grid-template-columns:298px minmax(0,1fr) 330px;min-height:0}
.col{overflow:auto;background:var(--panel);border-right:1px solid var(--line);min-height:0}
.col:last-child{border-right:none;border-left:1px solid var(--line)}
.col::-webkit-scrollbar,.ganttwrap::-webkit-scrollbar{width:9px;height:9px}
.col::-webkit-scrollbar-thumb,.ganttwrap::-webkit-scrollbar-thumb{background:#c3d1e0;
  border-radius:5px;border:2px solid var(--panel)}
.col::-webkit-scrollbar-track,.ganttwrap::-webkit-scrollbar-track{background:transparent}
.sect{padding:11px 13px;border-bottom:1px solid var(--line)}
.sect h2{margin:0 0 9px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);font-weight:600;display:flex;align-items:center;gap:8px}
.tag{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--faint);
  border:1px solid var(--line2);border-radius:4px;padding:0 5px;text-transform:none;letter-spacing:0}

/* 校验 */
.check{display:grid;grid-template-columns:15px 1fr;gap:8px;padding:5.5px 0;
  border-bottom:1px dashed #eef2f7}
.check:last-child{border-bottom:none}
.check .ic{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;margin-top:1px;
  flex-shrink:0}
.check.ok .ic{background:rgba(15,157,88,.1);color:var(--ok)}
.check.bad .ic{background:rgba(217,45,32,.1);color:var(--bad)}
.check .ic svg{width:8px;height:8px}
.check .n{font-size:11.5px;font-weight:550}
.check .d{font-family:var(--mono);font-size:9.8px;color:var(--faint);margin-top:1px;
  word-break:break-word;line-height:1.45}
.check .d em{font-style:normal;color:var(--dim)}

/* 内存 */
.memgrp{margin-bottom:12px}
.memgrp:last-of-type{margin-bottom:6px}
.memgrp .hd{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;
  margin-bottom:4px}
.memgrp .hd .lim{color:var(--faint)}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#e8eef5}
.stack i{display:block;height:100%}
.stack i.e{background:#5b8ec9}
.stack i.o{background:#d98b3a}
.stack i.a{background:#8a5cc4}
.memkey{display:flex;gap:10px;margin-top:4px;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.memkey span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.memkey b{width:5px;height:5px;border-radius:1px;display:inline-block}
.badge2{font-family:var(--mono);font-size:9px;padding:0 4px;border-radius:3px;
  background:#f1e9fe;color:#6d3fc4;margin-left:4px}
.note{margin-top:7px;font-size:10px;color:var(--faint);line-height:1.55;
  border-left:2px solid var(--line2);padding-left:7px}
.note b{color:var(--dim);font-weight:600}
.sumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px 4px;font-family:var(--mono);
  font-size:9.5px}
.sumgrid span{display:flex;justify-content:space-between;gap:3px;padding:1px 4px;
  background:#f2f6fa;border-radius:3px;color:var(--dim);overflow:hidden}
.sumgrid i{font-style:normal;color:var(--faint)}

/* 时长表 */
.durhead{display:grid;grid-template-columns:20px repeat(10,1fr);gap:2px;margin-bottom:3px;
  font-family:var(--mono);font-size:8px;color:var(--faint);text-align:center}
.durhead span:first-child{text-align:left}
.durrow{display:grid;grid-template-columns:20px repeat(10,1fr);gap:2px;align-items:center;
  margin-bottom:2px}
.durrow .lb{font-family:var(--mono);font-size:9px;color:var(--faint)}
.chip{font-family:var(--mono);font-size:8.6px;text-align:center;padding:1.5px 0;border-radius:2px;
  background:#eef2f7;color:#5a6b7d;overflow:hidden}
.chip.c{background:var(--comp);color:#3a2905}
.chip.cb{background:var(--compb);color:#6b4c12}
.chip.m{background:var(--comm);color:#05323a}
.chip.mb{background:var(--commb);color:#0c5560}

/* 中央 */
.center{display:flex;flex-direction:column;background:#fbfcfd;min-width:0;min-height:0}
.ctools{display:flex;align-items:center;gap:14px;padding:7px 13px;flex-shrink:0;
  border-bottom:1px solid var(--line);background:var(--panel)}
.legend{display:flex;gap:10px;font-family:var(--mono);font-size:9.5px;color:var(--dim);
  align-items:center;flex-wrap:wrap}
.legend b{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:3px;
  vertical-align:-1px}
.legend b.z{width:5px;height:5px;border-radius:50%;background:#8b98a8;
  box-shadow:0 0 0 1px #00000066}
.legend b.a{height:6px;background:var(--act);opacity:.8}
.zoom{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--faint);
  font-family:var(--mono);font-size:9.5px}
.zoom input{width:100px;accent-color:var(--accent)}
.ganttwrap{flex:0 0 auto;max-height:52%;overflow:auto;min-height:0;position:relative}
.gantt{padding:8px 0 14px;position:relative;background:#fbfcfd}
.ruler{position:sticky;top:0;height:24px;z-index:6;background:#fbfcfd;border-bottom:1px solid var(--line)}
.ruler .tick{position:absolute;top:0;height:24px;border-left:1px solid #e6ecf3}
.ruler .tick span{position:absolute;top:5px;left:4px;font-family:var(--mono);font-size:9.5px;
  color:var(--faint)}
.ruler .tick.major{border-color:#c8d5e3}
.ruler .tick.major span{color:var(--dim)}
.gline{position:absolute;top:0;bottom:0;border-left:1px solid #edf2f7;pointer-events:none;
  z-index:0}
.grp{margin-bottom:10px;position:relative;z-index:1}
.origin{position:absolute;top:0;bottom:0;border-left:1px solid #dde5ee;pointer-events:none}
.grphd{display:flex;align-items:center;gap:9px;padding:3px 10px 4px 10px;
  border-bottom:1px solid #eef2f7}
.grphd .nm{font-weight:650;font-size:12px;letter-spacing:-.01em}
.grphd .ly{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.grphd .util{margin-left:auto;display:flex;gap:12px;font-family:var(--mono);font-size:9.5px;
  color:var(--faint)}
.util i{font-style:normal;display:flex;align-items:center;gap:5px}
.util .bar{width:40px;height:4px;background:#e2eaf3;border-radius:2px;overflow:hidden}
.util .bar b{display:block;height:100%;border-radius:2px}
.lane{position:relative;height:27px;margin:1px 0}
.lane.act{background:#f6f9fc;border-top:1px solid #e6edf5;border-bottom:1px solid #e6edf5}
.lane .ll{position:absolute;left:0;top:0;width:54px;height:100%;display:flex;align-items:center;
  font-family:var(--mono);font-size:9.5px;color:#5a6b7d;padding-left:9px;z-index:3;
  background:linear-gradient(90deg,#fbfcfd 72%,rgba(251,252,253,0))}
.lane .track{position:absolute;left:54px;right:0;top:0;bottom:0;background:#f8fafc;
  border-top:1px solid #edf2f7;border-bottom:1px solid #edf2f7}
.lane.act .track{background:transparent;border:none}
.op{position:absolute;top:3px;height:21px;border-radius:3px;overflow:hidden;
  font-family:var(--mono);font-size:9px;line-height:21px;padding:0 4px;color:#3a2905;
  white-space:nowrap;cursor:pointer;border:1px solid rgba(0,0,0,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.op[data-e="comp"]{background:var(--comp)}
.op[data-e="comm"]{background:var(--comm)}
.op.bwd[data-e="comp"]{background:var(--compb);color:#6b4c12;
  background-image:var(--hatch)}
.op.bwd[data-e="comm"]{background:var(--commb);color:#0c5560;
  background-image:var(--hatch)}
.op:hover{filter:brightness(1.05) saturate(1.15)}
.op.sel{outline:2px solid #0f1720;outline-offset:1px;z-index:8;
  box-shadow:0 0 0 3px rgba(15,23,32,.12),inset 0 1px 0 rgba(255,255,255,.5)}
.op.ghost{opacity:.55;filter:saturate(.7)}
.op.ghost:hover{opacity:.7}
.lane.ghost{height:17px;margin:0 0 1px}
.lane.ghost .ll{font-size:8.5px;color:#9aabbd}
.lane.ghost .track{background:repeating-linear-gradient(90deg,#f6f9fc 0 6px,#f2f6fa 6px 12px);
  border-top:1px dashed #e2eaf3;border-bottom:1px dashed #e2eaf3}
.lane.ghost .op{top:2px;height:13px;line-height:13px;border-style:dashed}
.lane.ghost .zm{top:6px;width:4px;height:4px;opacity:.6}
.ruler .tick.ghostmark{border-color:#7c5cbf;border-style:dashed}
.ruler .tick.ghostmark span{color:#6d3fc4;font-weight:600}
.abtag{display:none;font-family:var(--mono);font-size:10px;color:var(--dim);
  padding:2px 7px;border-radius:6px;background:#f6f9fc;border:1px solid var(--line2)}
.abtag.on{display:inline-flex;gap:8px;align-items:center}
.abtag b{color:var(--fg)}
.abtag i{font-style:normal;color:#7c5cbf}
.cmpsel{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;
  color:var(--faint);border:1px solid var(--line2);border-radius:6px;padding:2px 7px;
  background:var(--panel2)}
.cmpsel select{background:transparent;border:none;color:var(--fg);font-family:var(--mono);
  font-size:10.5px;outline:none;max-width:120px}
.relscore{font-family:var(--mono);font-size:10px}
.relscore.good{color:#0b7a45}
.relscore.bad{color:var(--bad)}
.relscore.base{color:var(--dim)}
.op.err{background:rgba(217,45,32,.12)!important;border:1px dashed var(--bad)!important;
  color:#b42317!important}
.zm{position:absolute;top:10px;width:5px;height:5px;border-radius:50%;cursor:pointer;
  background:#94a3b4;box-shadow:0 0 0 1.5px #fbfcfd,0 0 0 2.5px rgba(148,163,180,.4);z-index:3}
.zm[data-e="comp"]{background:#d9932a}
.zm[data-e="comm"]{background:#2a9db1}
.zm:hover{box-shadow:0 0 0 1.5px #fbfcfd,0 0 0 3px #1b2431}
.zm.sel{box-shadow:0 0 0 1.5px #fbfcfd,0 0 0 3px #1b2431}
.zm.err{background:var(--bad)!important}
.span{position:absolute;border-radius:2px;background:linear-gradient(90deg,#a688e0,#cbb8ef);
  border:1px solid #8b6fd055;font-family:var(--mono);font-size:8px;color:#3f2a72;
  line-height:9px;padding-left:2px;overflow:hidden;white-space:nowrap}
.pk{position:absolute;top:0;bottom:0;width:1px;border-left:1px dashed #6d4fae;opacity:.8;
  z-index:4}
.pk span{position:absolute;top:-2px;left:4px;font-family:var(--mono);font-size:8px;
  color:#6d3fc4;background:#fbfcfd;padding:0 3px;border-radius:2px;white-space:nowrap;
  border:1px solid #e2d8f6}

/* 底部：引擎占用 + Time 分解 */
.bottompane{flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;
  border-top:1px solid var(--line);background:var(--panel)}
.bp{padding:8px 13px 10px;min-width:0}
.bp+.bp{border-left:1px solid var(--line)}
.bp h3{margin:0 0 6px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);font-weight:600;display:flex;align-items:center;gap:8px}
.use{display:grid;grid-template-columns:54px 1fr 52px;align-items:center;gap:8px;
  font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-bottom:4px}
.use .track{position:relative;height:9px;background:#e8eef5;border-radius:3px;overflow:hidden}
.use .track i{position:absolute;top:0;bottom:0;display:block}
.use .track i.w{background:var(--comp);opacity:.9}
.use .track i.m{background:var(--comm);opacity:.9}
.use .track .z{position:absolute;inset:0;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 2px,transparent 2px 5px)}
.use .pct{text-align:right;color:var(--dim)}
/* Time 分解瀑布 */
.wf{position:relative;height:22px;border-radius:4px;overflow:hidden;background:#e8eef5;
  margin:3px 0 7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.wf i{position:absolute;top:0;bottom:0;display:block}
.wf i.lead{background:#b9c7d7}
.wf i.busy{background:linear-gradient(90deg,#3fc9dd,#2ea9bd)}
.wf i.gap{background:repeating-linear-gradient(135deg,rgba(255,255,255,.7) 0 2px,transparent 2px 6px),
  #dde6ef}
.wf i.tail{background:#e0b4b7}
.wfkey{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono);font-size:9.5px;
  color:var(--faint)}
.wfkey span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.wfkey b{width:6px;height:6px;border-radius:1px;display:inline-block}
.wfkey em{font-style:normal;color:var(--dim)}

/* 操作清单 */
.oplist{flex:1 1 auto;min-height:110px;display:flex;flex-direction:column;
  border-top:1px solid var(--line);background:var(--panel)}
.opl-hd{display:flex;align-items:center;gap:9px;padding:5px 13px;flex-shrink:0;
  border-bottom:1px solid var(--line)}
.opl-hd h3{margin:0;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);font-weight:600}
.ftabs{display:flex;gap:3px;margin-left:6px}
.ftab{font-family:var(--mono);font-size:9.5px;padding:1px 7px;border-radius:999px;
  color:var(--faint);border:1px solid transparent}
.ftab:hover{color:var(--fg);background:#eef2f7}
.ftab[aria-selected="true"]{color:#fff;background:#1b2431;font-weight:600}
.opl-hd .cnt{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.opl-body{overflow:auto;flex:1}
.opl-body::-webkit-scrollbar{width:8px;height:8px}
.opl-body::-webkit-scrollbar-thumb{background:#c3d1e0;border-radius:4px}
table.opl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10px}
table.opl th{position:sticky;top:0;background:#f4f7fa;text-align:left;font-weight:500;
  color:var(--faint);font-size:9px;letter-spacing:.06em;padding:4px 8px;border-bottom:1px solid var(--line);z-index:2}
table.opl td{padding:3px 8px;border-bottom:1px solid #eff3f8;color:var(--dim);white-space:nowrap}
table.opl tr:hover td{background:#f2f7fc;color:var(--fg)}
table.opl tr.sel td{background:#e8f0fb;color:var(--fg)}
table.opl td.cellop{color:var(--fg)}
table.opl td .sw{display:inline-block;width:6px;height:6px;border-radius:1px;margin-right:5px;
  vertical-align:0}
table.opl td.n{text-align:right;font-variant-numeric:tabular-nums}
.pbar{position:relative;height:7px;border-radius:2px;background:#f1f5f9;overflow:hidden;
  max-width:260px}
.pbar i{position:absolute;top:0;bottom:0;border-radius:2px;display:block}

/* 右栏 */
.head{padding:11px 13px;border-bottom:1px solid var(--line);background:var(--panel2)}
.head .tok{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.01em}
.head .meta{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:9.5px;padding:1.5px 6px;border-radius:999px;border:1px solid}
.pill.comp{color:#96620a;border-color:#e6cfa4;background:#fdf5e7}
.pill.comm{color:#0a6c7c;border-color:#a9dbe4;background:#eefafc}
.pill.grp{color:var(--dim);border-color:var(--line2)}
.kv{display:grid;grid-template-columns:66px 1fr;gap:3px 9px;padding:10px 13px;
  border-bottom:1px solid var(--line);font-size:11.5px}
.kv .k{color:var(--faint);font-size:10px}
.kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
.kv .v small{color:var(--faint)}
.dep{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed #eef2f7;
  font-family:var(--mono);font-size:10.2px}
.dep:last-child{border-bottom:none}
.dep .arrow{color:var(--faint)}
.dep .tm{color:var(--dim)}
.dep .ok{color:var(--ok);margin-left:auto;font-size:9.5px}
.dep .bad{color:var(--bad);margin-left:auto;font-size:9.5px}
.locate{position:relative;height:26px;margin:9px 13px 2px;background:#f7f9fc;border:1px solid var(--line);
  border-radius:4px;overflow:hidden}
.locate .b{position:absolute;top:5px;height:16px;border-radius:2px;background:var(--comp);opacity:.8}
.locate .b.comm{background:var(--comm)}
.locate .mk{position:absolute;top:0;bottom:0;width:1px;background:#0f1720;opacity:.45}
.err{border-left:2px solid var(--bad);padding:5px 0 5px 8px;margin-bottom:9px}
.err:last-child{margin-bottom:0}
.err .t{font-family:var(--mono);font-size:11px;color:var(--bad)}
.err .m{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.5}
.err .fix{font-size:10px;color:var(--faint);margin-top:3px;font-family:var(--mono)}
.empty{padding:20px 14px;text-align:center;color:var(--faint);font-size:11px;line-height:1.7}
.howto{padding:2px 13px 12px}
.howto .row{display:grid;grid-template-columns:16px 1fr;gap:8px;padding:6px 0;
  border-bottom:1px dashed #eef2f7;font-size:11px}
.howto .row:last-child{border-bottom:none}
.howto .n{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;
  background:#eef2f7;color:#5a6b7d;font-family:var(--mono);font-size:9px;margin-top:1px}
.howto .t b{font-weight:600}
.howto .t span{color:var(--faint);font-family:var(--mono);font-size:9.8px;display:block;margin-top:1px}

/* 编辑弹层 */
.mask{position:fixed;inset:0;background:rgba(15,23,32,.34);z-index:60;display:none}
.mask.on{display:block}
.sheet{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(790px,94vw);max-height:86vh;display:none;flex-direction:column;overflow:hidden;
  background:var(--panel);border:1px solid var(--line2);border-radius:12px;
  box-shadow:0 28px 64px rgba(15,23,32,.26)}
.sheet.on{display:flex}
.sheet-hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet-hd h2{margin:0;font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.sheet-hd .sub{font-family:var(--mono);font-size:10px;color:var(--faint)}
.sheet-hd .cls{margin-left:auto;width:24px;height:24px;border-radius:6px;color:var(--faint);
  border:1px solid var(--line2);display:grid;place-items:center;font-size:13px;background:#fff}
.sheet-hd .cls:hover{color:var(--fg);background:#f4f7fa}
.tabs2{display:flex;gap:2px;padding:7px 14px 0;border-bottom:1px solid var(--line);background:var(--panel2)}
.tabs2 button{padding:6px 11px;border-radius:7px 7px 0 0;color:var(--dim);font-size:12px;
  border:1px solid transparent;border-bottom:none}
.tabs2 button:hover{color:var(--fg)}
.tabs2 button[aria-selected="true"]{background:var(--panel);color:var(--fg);font-weight:600;
  border-color:var(--line)}
.sheet-body{padding:14px 16px;overflow:auto;background:var(--panel)}
.frow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;margin-bottom:11px}
.flabel{font-size:11.5px;color:var(--dim)}
.stepper{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.stepper button{width:23px;height:23px;border:1px solid var(--line2);border-radius:6px;
  color:var(--dim);background:#fff;line-height:1}
.stepper button:hover{color:var(--fg);border-color:#9db0c4;background:#f4f8fc}
.stepper input{width:54px;text-align:center;font-family:var(--mono);font-size:12px;padding:3px;
  border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--fg)}
.eqn{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.chks{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:10px;color:var(--dim)}
.chks i{font-style:normal}
.chks .ok{color:#0b7a45}
.chks .bad{color:var(--bad)}
.kbtn{display:flex;gap:5px}
.kbtn button{padding:4px 10px;border:1px solid var(--line2);border-radius:6px;
  font-family:var(--mono);font-size:11px;color:var(--dim);background:#fff}
.kbtn button[aria-selected="true"]{background:#1b2431;color:#fff;border-color:#1b2431}
.cuts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cuts .cut{display:flex;align-items:center;gap:3px;font-family:var(--mono);font-size:10px;
  color:var(--faint)}
.cuts input{width:52px;text-align:center;font-family:var(--mono);font-size:11px;padding:3px;
  border:1px solid var(--line2);border-radius:5px;background:#fff;color:var(--fg)}
.cuts input.bad{border-color:var(--bad);background:#fdf3f2}
.quick{display:flex;gap:6px;margin-left:auto}
.quick button{padding:3px 9px;border:1px dashed var(--line2);border-radius:6px;
  font-size:10.5px;color:var(--dim);background:#fff}
.quick button:hover{color:var(--fg);border-style:solid;background:#f4f8fc}
.mapwrap{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:250px}
.maprow{display:flex;align-items:center;gap:4px;padding:3px 8px;border-bottom:1px solid #f0f4f8;
  font-family:var(--mono);font-size:10px}
.maprow:last-child{border-bottom:none}
.maprow .ly{width:30px;color:var(--faint);flex-shrink:0}
.maprow .cells{display:flex;gap:3px;flex-wrap:nowrap}
.maprow .cnt{margin-left:auto;display:flex;gap:6px;color:var(--faint);padding-left:10px}
.maprow .cnt .b{color:#0b7a45}
.maprow .cnt .w{color:var(--bad)}
.cellr{width:27px;height:21px;border-radius:4px;border:1px solid var(--line2);background:#fff;
  font-family:var(--mono);font-size:10px;color:var(--fg);cursor:pointer}
.cellr:hover{outline:2px solid #9db0c4;outline-offset:-1px}
.sheet-ft{display:flex;align-items:center;gap:9px;padding:10px 16px;border-top:1px solid var(--line);
  background:var(--panel2);flex-wrap:wrap}
.pv{font-family:var(--mono);font-size:10.5px;color:var(--dim);display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}
.pv .sep{color:#cdd8e4}
.pv b{color:var(--fg)}
.pv .bad{color:var(--bad)}
.pv .good{color:#0b7a45}
.pv .good2{color:#0b7a45}
.pv .hint{width:100%;color:var(--faint);font-size:9.5px;font-family:var(--sans);margin-top:2px}
.sheet-ft .sp{margin-left:auto}
.sheet-ft .btn{background:#fff}
.sheet-ft .btn.primary{background:#1b2431;color:#fff;border-color:#1b2431}
/* 版本 */
.verbtn{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;
  border-color:#cfd9e4;background:#fff;color:var(--fg)}
.verbtn:hover{background:#f4f8fc}
.verbtn .dot{width:6px;height:6px;border-radius:50%;background:#8b98a8}
.verbtn.dirty .dot{background:#7c5cbf}
.vpop{position:absolute;z-index:70;display:none;flex-direction:column;min-width:420px;
  background:var(--panel);border:1px solid var(--line2);border-radius:10px;
  box-shadow:0 18px 44px rgba(15,23,32,.2);padding:6px;overflow:hidden}
.vpop.on{display:flex}
.vpop .vh{display:flex;align-items:center;gap:8px;padding:6px 8px 8px;
  font-size:11px;color:var(--dim);border-bottom:1px solid var(--line);margin-bottom:4px}
.vpop .vh b{color:var(--fg)}
.vrow{display:grid;grid-template-columns:52px 1fr 74px 62px;gap:8px;align-items:center;
  padding:5px 8px;border-radius:6px;font-family:var(--mono);font-size:10.5px;cursor:pointer;
  color:var(--dim)}
.vrow:hover{background:#f4f8fc}
.vrow.cur{background:#eef3fb;color:var(--fg)}
.vrow .nm{font-family:var(--sans);font-size:11.5px;color:var(--fg);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.vrow .tm{text-align:right;color:var(--fg)}
.vrow .dl{text-align:right}
.vrow .dl.good{color:#0b7a45}
.vrow .dl.bad{color:var(--bad)}
.tabs3{display:flex;gap:2px}
.tabs3 button{padding:3px 9px;border-radius:6px;font-size:11px;color:var(--dim)}
.tabs3 button:hover{background:#eef2f7;color:var(--fg)}
.tabs3 button[aria-selected="true"]{background:#1b2431;color:#fff;font-weight:600}
table.runs{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10px}
table.runs th{position:sticky;top:0;background:#f4f7fa;text-align:left;font-weight:500;
  color:var(--faint);font-size:9px;letter-spacing:.06em;padding:4px 8px;
  border-bottom:1px solid var(--line);z-index:2}
table.runs td{padding:3px 8px;border-bottom:1px solid #eff3f8;color:var(--dim);white-space:nowrap}
table.runs tr:hover td{background:#f4f8fc;cursor:pointer}
table.runs tr.cur td{background:#eef3fb;color:var(--fg)}
table.runs td.n{text-align:right;font-variant-numeric:tabular-nums}
table.runs td .tagv{font-family:var(--mono);color:var(--fg)}
table.runs td .badge3{font-size:9px;padding:0 5px;border-radius:999px;margin-left:4px}
.badge3.ok{background:#e8f7ef;color:#0b7a45}
.badge3.bad{background:#fdeceb;color:#b42317}
.badge3.base{background:#eef2f7;color:#465a70}
.trendwrap{padding:10px 12px}
.vdiffcard{padding:10px 13px;border-bottom:1px solid var(--line)}
.vdiffcard .row{display:flex;gap:6px;align-items:center;padding:3px 0;
  font-family:var(--mono);font-size:10px;border-bottom:1px dashed #eef2f7}
.vdiffcard .row:last-child{border-bottom:none}
.vdiffcard .k{color:var(--faint);width:46px}
.vdiffcard .old{color:var(--faint);text-decoration:line-through}
.vdiffcard .new{color:#0b7a45}
.vdiffcard .new.worse{color:var(--bad)}
.draftchip{display:none;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  font-family:var(--mono);font-size:10px;color:#6d3fc4;background:#f3ecfe;border:1px solid #ddd0f7}
.draftchip.on{display:inline-flex}
.draftchip:hover{background:#ece0fd}

#tip{position:fixed;pointer-events:none;z-index:99;background:#fffffff2;
  border:1px solid var(--line2);border-radius:6px;padding:5px 8px;font-family:var(--mono);
  font-size:10.5px;line-height:1.55;opacity:0;transition:opacity .1s;
  box-shadow:0 10px 28px rgba(15,23,32,.16)}
#tip .k{color:var(--faint)}
.footer{height:24px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 15px;
  border-top:1px solid var(--line);background:#f7f9fc;font-family:var(--mono);font-size:9.5px;
  color:var(--faint)}
.footer .r{margin-left:auto}
@media (max-width:1240px){
  .grid{grid-template-columns:260px minmax(0,1fr) 300px}
  .vstats{gap:14px}
  .case-meta{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2f79b8" stroke-width="2.4"><path d="M4 19V6l7 5 7-5v13"/></svg>
    </span>
    MoE Judge <span class="ver">draft</span>
  </div>
  <div class="casebar" id="casebar"></div>
  <div class="actions">
    <button class="btn verbtn" id="verbtn"><span class="dot"></span>
      <span id="verlabel">版本</span> ▾</button>
    <button class="btn" id="btn-edit">编辑映射</button>
    <button class="btn" id="btn-illegal">注入非法调度</button>
    <button class="btn primary" id="btn-run">重新判题 <kbd>⌘↵</kbd></button>
  </div>
</header>

<section class="iobar">
  <div class="file"><span class="dot"></span><span id="file-in">—</span>
    <small id="file-in-meta"></small></div>
  <div class="file"><span class="dot"></span><span id="file-out">—</span>
    <small id="file-out-meta"></small></div>
  <button class="draftchip" id="draftchip"></button>
  <div class="spacer"></div>
  <label class="tog"><input type="checkbox" id="tg-zero" checked>零时长操作</label>
  <label class="tog">内存口径
    <select id="sel-mem">
      <option value="closed">闭区间</option>
      <option value="open">半开区间</option>
    </select>
  </label>
</section>

<section class="verdict" id="verdict" data-state="ok">
  <div class="vbadge" id="vbadge"></div>
  <div class="vcol">
    <div class="vhead">Time · §4.5</div>
    <div class="vrow"><span class="vtime" id="vtime">—</span>
      <span class="vunit">单位时间</span></div>
    <span class="vdiff flat" id="vdiff"></span>
  </div>
  <div class="vstats" id="vstats"></div>
  <div class="vbars" id="vbars"></div>
</section>

<main class="grid">
  <aside class="col" id="col-left"></aside>
  <section class="center">
    <div class="ctools">
      <div class="legend">
        <span><b style="background:var(--comp)"></b>计算·前向</span>
        <span><b style="background:var(--compb)"></b>计算·反向</span>
        <span><b style="background:var(--comm)"></b>通信·前向</span>
        <span><b style="background:var(--commb)"></b>通信·反向</span>
        <span><b class="z"></b>零时长</span>
        <span><b class="a"></b>激活存活</span>
      </div>
      <span class="abtag" id="abtag"></span>
      <label class="cmpsel">对比 B
        <select id="cmpsel"></select></label>
      <label class="cmpsel" id="cmpscaleWrap" style="display:none">刻度
        <select id="cmpscale">
          <option value="abs">同一</option>
          <option value="norm">归一</option>
        </select></label>
      <div class="zoom">缩放 <input type="range" id="zoom" min="100" max="360" value="100">
        <span id="zoomv">1.0×</span></div>
    </div>
    <div class="ganttwrap" id="ganttwrap"><div class="gantt" id="gantt"></div></div>
    <div class="oplist">
      <div class="opl-hd">
        <div class="tabs3" id="tabs3"></div>
        <div class="ftabs" id="ftabs"></div>
        <span class="cnt" id="oplcnt"></span>
      </div>
      <div class="opl-body" id="oplbody"></div>
    </div>
    <div class="bottompane">
      <div class="bp" id="usepane"></div>
      <div class="bp" id="timepane"></div>
    </div>
  </section>
  <aside class="col" id="col-right"></aside>
</main>

<div class="footer">
  <span>设计稿 · 时间表取自题面 §7.1 / §7.2，时长与内存按 §4.1 / §4.6 计算</span>
  <span class="r" id="foot-state"></span>
</div>
<div class="vpop" id="vpop"></div>
<div id="tip"></div>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-hd">
    <h2>编辑映射</h2>
    <span class="sub" id="sheet-sub"></span>
    <button class="cls" id="sheet-close">×</button>
  </div>
  <div class="tabs2" id="sheet-tabs"></div>
  <div class="sheet-body" id="sheet-body"></div>
  <div class="sheet-ft">
    <div class="pv" id="sheet-pv"></div>
    <span class="sp"></span>
    <button class="btn" id="sheet-reset">重置为样例</button>
    <button class="btn" id="sheet-cancel">取消</button>
    <button class="btn primary" id="sheet-apply">应用并重算</button>
  </div>
</div>

  {id:"v0.1", label:"题面样例映射", note:"手工调度 · 基线", commit:"d8c2f10"},
  {id:"v0.2", label:"接入列表调度", note:"1 种优先级", commit:"a91b3e4",
   cfg:{ex1:{}, ex2:{}}, modes:[0]},
  {id:"v0.3", label:"加优先级变体", note:"3 种取最优", commit:"7f40c2d",
   cfg:{ex1:{}, ex2:{}}, modes:[0,1,2]},
  {id:"v0.4", label:"试 P=4（跨节点）", note:"通信爆炸，已回退", commit:"c5ee881",
   cfg:{ex1:{}, ex2:{V:1, P:4, D:1, K:1, psi:[],
     map:[[0,1,2,3],[0,1,2,3]]}}, modes:[0,1,2]},
  {id:"v0.5", label:"回退 P=2", note:"6 种优先级取最优", commit:"3ad9f07",
   cfg:{ex1:{}, ex2:{}}, modes:[0,1,2,3,4,5]},
  {id:"v1.0", label:"候选提交", note:"当前最好合法版本", commit:"9b1c55a",
   cfg:{ex1:{}, ex2:{}}, modes:[0,1,2,3,4,5]},
];
const verCache = new Map();
function verCase(verId, caseId){
  const key = verId + ":" + caseId;
  if(verCache.has(key)) return verCache.get(key);
  const base = CASES.find(c=>c.id===caseId);
  const ver = VERSIONS.find(v=>v.id===verId) || VERSIONS[0];
  const per = ver.cfg ? (ver.cfg[caseId] || {}) : null;
  let out = base;
  if(per){
    const cfg = {...JSON.parse(JSON.stringify(base.init)), ...per};
    cfg.psi = (cfg.psi||[]).map(Number);
    cfg.map = cfg.map.map(r=>r.slice());
    const errs = validateCfg(base, cfg);
    out = errs.length ? {...base, verBad: errs[0], ver, verCfg: cfg, verModes: ver.modes}
                      : {...buildDraft(base, cfg, ver.modes), ver, verCfg: cfg,
                         verModes: ver.modes};
  } else {
    out = {...base, ver};
  }
  verCache.set(key, out);
  return out;
}
function cur(){ return verCase(state.version, state.id); }
function relScore(verId){
  let s = 0, n = 0;
  for(const cs of CASES){
    const r = verRow(verId, cs.id);
    if(!r.ok) return null;
    s += Math.log(r.time / r.base); n++;
  }
  return n ? Math.exp(s/n) : null;
}
function verRow(v, caseId){
  const st = VERSIONS.find(x=>x.id===v);
  const c = verCase(v, caseId);
  const base = CASES.find(x=>x.id===caseId);
  return {ver: st, ok: !c.verBad, time: c.time, base: base.time,
          mem: Math.max(...c.memory.map(m=>m.total)), limit: c.scalars.M,
          commit: st.commit, label: st.label, note: st.note};
}


function illegalCase(base){
  const c = JSON.parse(JSON.stringify(base));
  c.ops.forEach(o=>{
    const p = DATA.illegalDemo.patches.find(p=>p.key===o.key);
    if(p){ o.t=p.t; o.end=o.t+o.dur; o._patched=true; }
  });
  c.time = Math.max(...c.ops.map(o=>o.end));
  c.errors = [
    {tok:"0:0:gemm", cls:"dependency-conflict",
     msg:"声明于 t=80，但前置 0:0:disp 直到 86 才完成（§4.2 第 4 条因果性）",
     fix:"最小合法起点 86"},
    {tok:"1:0:comb", cls:"engine-conflict",
     msg:"声明于 t=210，但该卡组通信引擎被 0:0:comb 占用到 226（§4.2 第 3 条）",
     fix:"最小合法起点 226"}
  ];
  return c;
}

/* ---------------- 顶部 ---------------- */
function renderTop(c, ok){
  const cb = document.getElementById("casebar");
  cb.innerHTML = CASES.map(k=>`<button class="case-tab" data-case="${k.id}"
    aria-selected="${k.id===state.id}">${k.title}</button>`).join("")
    + `<span class="case-meta">V=${c.scalars.V} P=${c.scalars.P} D=${c.scalars.D} · `
    + `L=${c.scalars.L} E=${c.scalars.E} · nmb=${c.scalars.nmb}</span>`;
  cb.querySelectorAll(".case-tab").forEach(b=>b.onclick=()=>{
    state.id=b.dataset.case; state.illegal=false; state.sel=null;
    document.getElementById("btn-illegal").textContent="注入非法调度"; render();
  });

  const isBaseVer = !c.verCfg;
  document.getElementById("file-in").textContent = state.id+".in";
  document.getElementById("file-out").textContent = ok
    ? (isBaseVer ? state.id+".out" : `${state.version}/${state.id}.out`)
    : `${state.version}/${state.id}.bad`;
  document.getElementById("file-in-meta").textContent =
    `${c.scalars.L} 层 · ${c.scalars.E} 专家 · M=${c.scalars.M}`;
  document.getElementById("file-out-meta").textContent =
    `${c.ops.length} ops · ${c.groups.length} 卡组`;

  const v = document.getElementById("verdict");
  v.dataset.state = ok ? "ok" : "bad";
  document.getElementById("vbadge").innerHTML = ok
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M20 6L9 17l-5-5"/></svg>合法`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M18 6L6 18M6 6l12 12"/></svg>非法 · 记 0 分`;
  document.getElementById("vtime").textContent = ok ? c.time : "—";

  const d = c.time - c.expected, dv = document.getElementById("vdiff");
  dv.className = "vdiff " + (d===0?"flat":d<0?"better":"worse");
  const isBase = !c.verCfg;
  const prevVer = (()=>{ const i = VERSIONS.findIndex(v=>v.id===state.version);
    return i>0 ? VERSIONS[i-1].id : null; })();
  const prevTime = prevVer ? verCase(prevVer, state.id).time : null;
  dv.textContent = ok
    ? (isBase
        ? `样例值 ${c.expected} · ${d===0?"持平":(d<0?d:"+"+d)}（${c.expectedSrc}）`
        : `${state.version} · 贪心 ${c.time} · 样例 ${c.expected}${
            prevTime!==null && prevVer ? `（较 ${prevVer} ${c.time-prevTime>0?"+":""}${c.time-prevTime}）` : ""}`)
    : `${state.version} · 映射非法，未产出调度`;

  // 对比摘要
  const cmpWrap = document.getElementById("cmpscaleWrap");
  if(cmpWrap) cmpWrap.style.display = state.cmp ? "flex" : "none";
  const cmpSel2 = document.getElementById("cmpscale");
  if(cmpSel2) cmpSel2.value = state.cmpScale;
  const cmpEl = document.getElementById("cmpsel");
  if(cmpEl){
    cmpEl.innerHTML = `<option value="">无</option>` + VERSIONS
      .filter(v=>v.id!==state.version)
      .map(v=>`<option value="${v.id}" ${state.cmp===v.id?"selected":""}>${v.id}</option>`)
      .join("");
  }
  const abtag = document.getElementById("abtag");
  if(abtag){
    if(state.cmp){
      const cb0 = verCase(state.cmp, state.id);
      abtag.classList.add("on");
      abtag.innerHTML = `<i>A</i> <b>${state.version} · ${c.time}</b>
        <i>B</i> <b>${state.cmp} · ${cb0.verBad?"非法":cb0.time}</b>`;
    } else { abtag.classList.remove("on"); abtag.textContent = ""; }
  }
  if(state.cmp){
    const cb = verCase(state.cmp, state.id);
    if(cb && !cb.verBad){
      const d = c.time - cb.time;
      const pct = cb.time ? (100*d/cb.time) : 0;
      dv.textContent += ` ｜ B ${state.cmp} ${cb.time} · ${d===0?"持平":(d>0?"+":"")+pct.toFixed(1)+"%"}`;
    }
  }

  // 版本按钮
  const vb = document.getElementById("verbtn");
  vb.classList.toggle("dirty", !isBase);
  document.getElementById("verlabel").textContent = state.version;
  vb.title = (VERSIONS.find(v=>v.id===state.version)||{}).label || "";

  const eng = c.engines, mem = state.mem==="closed"?c.memory:c.memoryOpen;
  const mu = Math.max(...eng.map(e=>e.mu)), cu = Math.max(...eng.map(e=>e.cu));
  const mm = Math.max(...mem.map(m=>m.total));
  document.getElementById("vstats").innerHTML = `
    <div class="stat"><div class="k">引擎下界</div><div class="v">${c.lb}</div></div>
    <div class="stat"><div class="k">通信引擎占用</div>
      <div class="v">${(mu*100).toFixed(1)}<small>%</small></div></div>
    <div class="stat"><div class="k">计算引擎占用</div>
      <div class="v">${(cu*100).toFixed(1)}<small>%</small></div></div>
    <div class="stat"><div class="k">峰值内存</div>
      <div class="v">${mm}<small>/ ${c.scalars.M}</small></div></div>`;

  const gap = 100*(1-c.lb/c.time);
  document.getElementById("vbars").innerHTML = `
    <div class="vbar-row"><span class="cap">下界</span>
      <div class="vbar"><i class="lb" style="width:${100*c.lb/c.time}%"></i></div>
      <span class="val">${c.lb}</span></div>
    <div class="vbar-row"><span class="cap">Time</span>
      <div class="vbar"><i class="tm" style="width:100%"></i></div>
      <span class="val">${ok?c.time:"—"}</span></div>
    <div class="vnote">空隙 ${gap.toFixed(1)}% · 填充 / 排空 / 首尾依赖</div>`;
}

/* ---------------- 左栏 ---------------- */
function renderLeft(c, ok){
  const mem = state.mem==="closed"?c.memory:c.memoryOpen;
  const memAlt = state.mem==="closed"?c.memoryOpen:c.memory;
  const checks = CHECKS.map(([n,dd],i)=>{
    let st="ok", det=dd;
    const sc=c.scalars;
    if(i===0) det=`V·P·D = <em>${sc.V}·${sc.P}·${sc.D} = ${sc.V*sc.P*sc.D}</em> = R`;
    if(i===1) det=`K = <em>${c.groups.length}</em> · 块内层连续`;
    if(i===2) det=`每 rank 恰好 <em>${sc.E/sc.P}</em> 个专家`;
    if(i===3) det=`<em>${c.ops.length}/${c.ops.length}</em> 个三元组 · 无重复`;
    if(i===4) det=`s→disp→gemm→comb · 反向 6 步`;
    if(i===5) det=`s(ℓ) ≥ comb(ℓ−1) · s_bwd(ℓ) ≥ disp_bwd(ℓ+1)`;
    if(i===6) det=`<em>${c.ops.filter(o=>o.dur===0).length}</em> 个零时长，均不占引擎`;
    if(i===7){
      const bad = mem.some(m=>m.total>m.limit);
      det = mem.map(m=>`<em>${m.total}</em>`).join(" / ")+` ≤ ${mem[0].limit}`;
      if(bad) st="bad";
    }
    if(!ok && (i===4||i===6)){ st="bad"; det="见右栏问题列表"; }
    return `<div class="check ${st}"><div class="ic">${st==="ok"
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.5"><path d="M20 6L9 17l-5-5"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.5"><path d="M18 6L6 18M6 6l12 12"/></svg>`}
      </div><div><div class="n">${n}</div><div class="d">${det}</div></div></div>`;
  }).join("");

  const memHtml = mem.map((m,i)=>{
    const p = 100/m.total;
    const alt = memAlt[i].total;
    return `<div class="memgrp">
      <div class="hd"><span>卡组 v=${m.v} · 层 ${m.layers.join(",")}</span>
        <span class="lim">${m.total} / ${m.limit}</span></div>
      <div class="stack">
        <i class="e" style="width:${m.mexp*p}%"></i>
        <i class="o" style="width:${m.movl*p}%"></i>
        <i class="a" style="width:${m.mact*p}%"></i>
      </div>
      <div class="memkey">
        <span><b style="background:#5b8ec9"></b>Mexp ${m.mexp}</span>
        <span><b style="background:#d98b3a"></b>Movl ${m.movl}</span>
        <span><b style="background:#8a5cc4"></b>Mact ${m.mact}</span>
        ${m.actPeak>1?`<span class="badge2">激活峰值 ${m.actPeak} @${m.actPeakAt}</span>`:""}
      </div>
      ${alt!==m.total?`<div class="note">口径敏感：闭区间 <b>${
        state.mem==="closed"?m.total:alt}</b> · 半开 <b>${
        state.mem==="closed"?alt:m.total}</b></div>`:""}
    </div>`;
  }).join("");

  const order = ["s","disp","gemm","comb","s_bwd","comb_bwd","gemm_dx","gemm_dw","disp_bwd","s_dw"];
  const head = `<div class="durhead"><span>ℓ</span>${order.map(o=>`<span>${SHORT[o]}</span>`).join("")}</div>`;
  const rows = c.durations.map(d=>{
    const cells = order.map(op=>{
      const isComp = ["s","gemm","s_bwd","gemm_dx","gemm_dw","s_dw"].includes(op);
      const cls = isComp ? (ISBWD(op)?"cb":"c") : (ISBWD(op)?"mb":"m");
      return `<span class="chip ${cls}" title="${OPNAME[op]}">${d.d[op]}</span>`;
    }).join("");
    return `<div class="durrow"><span class="lb">${d.l}</span>${cells}</div>`;
  }).join("");

  const sc = c.scalars;
  const sum = [["N",sc.N],["S",sc.S],["M",sc.M],["B_in",sc.Bin],["B_out",sc.Bout],
    ["L",sc.L],["E",sc.E],["Z",sc.Z],["Zs",sc.Zs],["U",sc.U],["Uact",sc.Uact],
    ["k",sc.k],["nmb",sc.nmb],["Fs",sc.Fs],["Fio",sc.Fio],["Fin",sc.Fin],
    ["V",sc.V],["P",sc.P],["D",sc.D]]
    .map(([k,v])=>`<span><i>${k}</i>${v}</span>`).join("");
  document.getElementById("col-left").innerHTML = `
    <div class="sect"><h2>输入摘要<span class="tag">已解析</span></h2>
      <div class="sumgrid">${sum}</div></div>
    <div class="sect"><h2>校验清单<span class="tag">§4.7 · §4.2</span></h2>${checks}</div>
    <div class="sect"><h2>内存三块<span class="tag">§4.6</span></h2>${memHtml}
      <div class="note">Movl = U × 通信并发峰值；Mact = Uact × [comb 结束, s_bwd 开始] 内的激活数。
        题面把“恰好首尾相接”算两块 → 闭区间。</div></div>
    <div class="sect"><h2>每层时长<span class="tag">§4.1</span></h2>${head}${rows}
      <div class="note">偏斜负载只抬高计算侧 m<sub>ℓ</sub>，不改变通信侧 x<sub>ℓ</sub>。</div>
    </div>`;
}

/* ---------------- 甘特 ---------------- */
function renderGantt(c, ok){
  const wrap = document.getElementById("gantt");
  const host = document.getElementById("ganttwrap");
  const avail = Math.max(440, host.clientWidth - 16);
  const inner = avail * state.zoom;
  const PAD = 54, RIGHT = 10;
  const cmp = state.cmp ? verCase(state.cmp, state.id) : null;
  const norm = !!(cmp && state.cmpScale === "norm");
  const TMAX = Math.max(c.time, cmp ? cmp.time : 0);
  const W = inner - PAD - RIGHT;
  const scale = W / Math.max(1, TMAX);
  const XA = t => PAD + (norm ? (t/c.time)*W : t*scale);
  const XB = t => PAD + (norm ? (t/cmp.time)*W : t*scale);
  const X = t => XA(t);

  let ticks="", grid="";
  if(norm){
    for(let k=0;k<=10;k++){
      const px = PAD + W*k/10;
      ticks += `<div class="tick ${k%5===0?"major":""}" style="left:${px}px">
        <span>${k*10}%</span></div>`;
      grid += `<div class="gline" style="left:${px}px"></div>`;
    }

  } else {
    const steps = [1,2,5,10,20,25,50,100,200,250,500,1000,1250,2000,2500,5000,10000,25000,50000];
    const target = TMAX / Math.max(4, Math.floor((inner-PAD)/86));
    const step = steps.find(s=>s>=target) || 100000;
    for(let t=0;t<=TMAX+1e-9;t+=step){
      const major = t>0 && (Math.round(t/step)%5===0);
      ticks += `<div class="tick ${major?"major":""}" style="left:${X(t)}px">
        <span>${t}</span></div>`;
      grid += `<div class="gline" style="left:${X(t)}px"></div>`;
    }
    ticks += `<div class="tick major" style="left:${XA(c.time)}px"><span>${c.time}</span></div>`;
    if(cmp && cmp.time !== c.time)
      ticks += `<div class="tick ghostmark" style="left:${XB(cmp.time)}px;top:11px">
        <span>B ${cmp.time}</span></div>`;
  }

  const nmb = c.scalars.nmb;
  const mkOp = (o, ghost) => {
    const XX = ghost ? XB : XA;
    const zero = o.dur === 0;
    if(zero){
      if(!state.zero) return "";
      const cls = ["zm"]; if(ghost) cls.push("ghost");
      if(!ok && o._patched) cls.push("err");
      if(!ghost && state.sel===selId(o)) cls.push("sel");
      return `<div class="${cls.join(" ")}" data-e="${o.engine}" style="left:${XX(o.t)}px"
        ${ghost?"":`data-key="${o.key}" data-mb="${o.mb}"`}></div>`;
    }
    const w = Math.max(2, o.dur * (ghost && norm ? (W/cmp.time) : scale));
    const cls = ["op"];
    if(ISBWD(o.op)) cls.push("bwd");
    if(ghost) cls.push("ghost");
    if(!ok && o._patched) cls.push("err");
    if(!ghost && state.sel===selId(o)) cls.push("sel");
    const txt = ghost ? "" : (w>52 ? `${o.mb}·${SHORT[o.op]}` : (w>24 ? SHORT[o.op] : ""));
    return `<div class="${cls.join(" ")}" data-e="${o.engine}"
      style="left:${XX(o.t)}px;width:${w}px"
      ${ghost?"":`data-key="${o.key}" data-mb="${o.mb}"`}>${txt}</div>`;
  };

  const groups = c.groups.map(g=>{
    const ops = c.ops.filter(o=>o.g===g.v);
    const e = c.engines[g.v];
    const mem = (state.mem==="closed"?c.memory:c.memoryOpen)[g.v];
    const comp = ops.filter(o=>o.engine==="comp").map(o=>mkOp(o,false)).join("");
    const comm = ops.filter(o=>o.engine==="comm").map(o=>mkOp(o,false)).join("");
    // act 泳道
    const rowH = 7, actH = nmb*rowH + 4;
    const spans = [];
    for(let mb=0;mb<nmb;mb++){
      for(const l of g.layers){
        const comb = c.ops.find(o=>o.mb===mb&&o.l===l&&o.op==="comb");
        const sb = c.ops.find(o=>o.mb===mb&&o.l===l&&o.op==="s_bwd");
        const a = X(comb.end), b = X(sb.t);
        spans.push(`<div class="span" style="left:${a}px;width:${Math.max(2,b-a)}px;
          top:${2+mb*rowH}px;height:${rowH-1}px">${mb}·ℓ${l}</div>`);
      }
    }
    const peakMark = (mem.actPeak>1 && mem.actPeakAt!==null)
      ? `<div class="pk" style="left:${X(mem.actPeakAt)}px">
           <span>Mact 峰值 ${mem.actPeak} @${mem.actPeakAt}</span></div>` : "";

    // B 版本幽灵车道
    let ghostHtml = "";
    if(cmp){
      const gb = cmp.groups.find(x=>x.v===g.v);
      const opsB = cmp.ops.filter(o=>o.g===g.v);
      const compB = opsB.filter(o=>o.engine==="comp").map(o=>mkOp(o,true)).join("");
      const commB = opsB.filter(o=>o.engine==="comm").map(o=>mkOp(o,true)).join("");
      ghostHtml = `<div class="lane ghost"><div class="ll">B 计算</div>
          <div class="track">${compB}</div></div>
        <div class="lane ghost"><div class="ll">B 通信</div>
          <div class="track">${commB}</div></div>`;
    }

    return `<div class="grp">
      <div class="grphd">
        <span class="nm">卡组 v=${g.v}</span>
        <span class="ly">层 ${g.layers.join(", ")} · P·D=${c.scalars.P*c.scalars.D} 张卡 ·
          内存 ${mem.total}/${mem.limit}</span>
        <span class="util">
          <i>计算 ${(e.cu*100).toFixed(0)}%<span class="bar"><b style="background:var(--comp);width:${e.cu*100}%"></b></span></i>
          <i>通信 ${(e.mu*100).toFixed(0)}%<span class="bar"><b style="background:var(--comm);width:${e.mu*100}%"></b></span></i>
        </span>
      </div>
      <div class="lane"><div class="ll">A 计算</div><div class="track">${comp}</div></div>
      <div class="lane"><div class="ll">A 通信</div><div class="track">${comm}</div></div>
      <div class="lane act" style="height:${actH}px"><div class="ll">激活</div>
        <div class="track">${spans.join("")}${peakMark}</div></div>
      ${ghostHtml}
    </div>`;
  }).join("");

  wrap.innerHTML = `<div class="ruler" style="width:${Math.max(inner,avail)}px">${ticks}</div>
    <div style="position:relative;width:${Math.max(inner,avail)}px">${grid}${groups}</div>`;

  wrap.querySelectorAll(".op:not(.ghost),.zm:not(.ghost)").forEach(el=>{
    el.onclick = ()=>{ state.sel = el.dataset.key+"#"+el.dataset.mb; render(); };
    el.onmouseenter = ()=>{
      const o = c.ops.find(x=>x.key===el.dataset.key);
      const tip = document.getElementById("tip");
      tip.innerHTML = `<div><b>${o.key}</b> · ${OPNAME[o.op]}</div>
        <div><span class="k">t</span> ${o.t} → ${o.end}
        <span class="k">dur</span> ${o.dur}${o.dur===0?"（不占引擎）":""}</div>
        <div><span class="k">${o.engine==="comp"?"计算引擎":"通信引擎"}</span> ·
        <span class="k">卡组</span> v=${o.g}</div>`;
      tip.style.opacity = 1;
    };
    el.onmousemove = ev=>{
      const tip = document.getElementById("tip");
      tip.style.left = Math.min(ev.clientX+14, innerWidth-230)+"px";
      tip.style.top = (ev.clientY+16)+"px";
    };
    el.onmouseleave = ()=>{ document.getElementById("tip").style.opacity = 0; };
  });
  renderUse(c);
}

function renderUse(c){
  const rows = c.engines.map(e=>{
    const cu = e.cu*100, mu = e.mu*100;
    return `<div class="use"><span>v=${e.v}</span>
      <div class="track" title="计算引擎占用">
        <i class="w" style="left:0;width:${cu}%"></i><div class="z"></div></div>
      <span class="pct">${cu.toFixed(0)}%</span></div>
      <div class="use"><span></span>
      <div class="track" title="通信引擎占用">
        <i class="m" style="left:0;width:${mu}%"></i><div class="z"></div></div>
      <span class="pct">${mu.toFixed(0)}%</span></div>`;
  }).join("");
  document.getElementById("usepane").innerHTML = `
    <h3>引擎占用<span class="tag" style="margin-left:4px">斜纹 = 空隙</span></h3>${rows}`;
}


/* 运行记录：版本 × 测试点 */
function renderRuns(){
  const scores = VERSIONS.map(v=>({id:v.id, s:relScore(v.id)}))
    .filter(x=>x.s!==null).sort((a,b)=>a.s-b.s);
  const head = `<tr><th>排名</th><th>版本</th><th>说明</th>
    ${CASES.map(c=>`<th>${c.id}</th>`).join("")}
    <th>相对分</th><th>峰值内存(${state.id})</th><th>commit</th><th>状态</th></tr>`;
  const curIdx = VERSIONS.findIndex(v=>v.id===state.version);
  const rows = VERSIONS.map((v,i)=>{
    const sc2 = relScore(v.id);
    const rank = sc2===null ? "—" : (scores.findIndex(x=>x.id===v.id)+1);
    const relCls = sc2===null ? "" : (sc2<0.999 ? "good" : (sc2>1.001 ? "bad" : "base"));
    const relTxt = sc2===null ? "非法" : (sc2===1 ? "1.000" : sc2.toFixed(3));
    const star = rank===1 ? " ★" : "";
    const cells = CASES.map(cs=>{
      const r = verRow(v.id, cs.id);
      const prev = i>0 ? verRow(VERSIONS[i-1].id, cs.id) : null;
      const d = prev && prev.ok && r.ok ? r.time - prev.time : null;
      const base = CASES.find(x=>x.id===cs.id).time;
      const cls = r.time > base ? "bad" : (r.time < base ? "good" : "");
      const dd = d===null || d===0 ? "" :
        `<span class="${d>0?'bad':'good'}" style="margin-left:5px;font-size:9px">${
          d>0?"+":""}${d}</span>`;
      return `<td class="n ${r.ok?"":"bad"}">${r.ok?`<span class="${cls}">${r.time}</span>${dd}`:"—"}</td>`;
    }).join("");
    const r0 = verRow(v.id, state.id);
    return `<tr data-v="${v.id}" class="${v.id===state.version?"cur":""}">
      <td class="n">${rank}${star}</td>
      <td><span class="tagv">${v.id}</span></td>
      <td style="font-family:var(--sans);font-size:11px">${v.label}
        <span style="color:var(--faint)">· ${v.note}</span></td>
      ${cells}
      <td class="n"><span class="relscore ${relCls}">${relTxt}</span></td>
      <td class="n">${r0.ok?r0.mem:"—"}</td>
      <td>${v.commit}</td>
      <td>${r0.ok?`<span class="badge3 ${v.id==="v0.1"?"base":"ok"}">${
        v.id==="v0.1"?"样例":"合法"}</span>`
        :`<span class="badge3 bad">非法</span>`}</td></tr>`;
  }).join("");
  const best = scores.length ? scores[0] : null;
  document.getElementById("oplcnt").textContent =
    `${VERSIONS.length} 个版本 × ${CASES.length} 个测试点` +
    (best ? ` · 相对分最优 ${best.id} (${best.s.toFixed(3)})` : "");
  document.getElementById("oplbody").innerHTML =
    `<table class="runs"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
  document.querySelectorAll("table.runs tbody tr").forEach(tr=>{
    tr.onclick = ()=>{ state.version = tr.dataset.v; state.sel=null; render(); };
  });
}

/* 回归趋势：当前测试点的 Time 随版本变化 */
function renderTrend(){
  const cs = state.id;
  const base = CASES.find(c=>c.id===cs);
  const data = VERSIONS.map((v,i)=>{
    const r = verRow(v.id, cs);
    return {i, id: v.id, time: r.time, ok: r.ok, base: r.base};
  });
  const W = 760, H = 210, PADL = 66, PADR = 20, PADT = 20, PADB = 42;
  const vals = data.filter(d=>d.ok).map(d=>d.time);
  const rawHi = Math.max(base.time, ...vals) || 1;
  const rawLo = Math.min(base.time, ...vals) || 1;
  const useLog = rawHi / rawLo > 3;
  const hi = useLog ? Math.log(rawHi*1.15) : rawHi*1.08;
  const lo = useLog ? Math.log(Math.max(1, rawLo*0.85)) : rawLo*0.93;
  const tr = t => useLog ? Math.log(t) : t;
  const X = i => PADL + (W-PADL-PADR) * (data.length<=1 ? 0.5 : i/(data.length-1));
  const Y = t => PADT + (H-PADT-PADB) * (1 - (tr(t)-lo)/(hi-lo));

  // 网格线（对数刻度时取几何中点）
  const gvals = useLog
    ? [rawLo, Math.round(Math.sqrt(rawLo*rawHi)), rawHi]
    : [rawLo, Math.round((rawLo+rawHi)/2), rawHi];
  const gridY = gvals.map(v=>`<line x1="${PADL}" x2="${W-PADR}" y1="${Y(v)}" y2="${Y(v)}"
      stroke="#eef2f7"></line>
    <text x="${PADL-8}" y="${Y(v)+3}" text-anchor="end" font-size="9"
      font-family="ui-monospace" fill="#8194a8">${Math.round(v)}</text>`).join("");

  const pts = data.filter(d=>d.ok).map(d=>`${X(d.i)},${Y(d.time)}`).join(" ");
  const dots = data.map(d=>{
    if(!d.ok) return `<g><text x="${X(d.i)}" y="${H-16}" text-anchor="middle" font-size="9"
        font-family="ui-monospace" fill="#d92d20">${d.id}</text>
      <text x="${X(d.i)}" y="${PADT+12}" text-anchor="middle" font-size="9"
        fill="#d92d20">非法</text></g>`;
    const y = Y(d.time), high = y < PADT + (H-PADT-PADB)*0.35;
    const col = d.time < base.time ? "#0b7a45" : (d.time > base.time ? "#d92d20" : "#94a3b8");
    return `<g><circle cx="${X(d.i)}" cy="${y}" r="4.5" fill="${col}"
        stroke="#fff" stroke-width="1.6"></circle>
      <text x="${X(d.i)}" y="${high ? y+17 : y-10}" text-anchor="middle" font-size="9.5"
        font-family="ui-monospace" fill="#465a70">${d.time}</text>
      <text x="${X(d.i)}" y="${H-16}" text-anchor="middle" font-size="9"
        font-family="ui-monospace" fill="#6d8098">${d.id}</text></g>`;
  }).join("");

  const baseLine = `<line x1="${PADL}" x2="${W-PADR}" y1="${Y(base.time)}" y2="${Y(base.time)}"
      stroke="#94a3b8" stroke-dasharray="4 4"></line>`;

  document.getElementById("oplcnt").textContent = `${cs} · ${data.length} 个版本`;
  document.getElementById("oplbody").innerHTML = `
    <div class="trendwrap">
      <div style="display:flex;justify-content:center">
        <svg width="100%" viewBox="0 0 ${W} ${H}" style="max-width:${W}px">
          ${gridY}${baseLine}
          <polyline points="${pts}" fill="none" stroke="#3fb3c8" stroke-width="1.6"></polyline>
          ${dots}
        </svg>
      </div>
      <div class="wfkey" style="justify-content:center;margin-top:2px">
        <span><b style="background:#3fb3c8"></b>各版本 Time</span>
        <span><b style="background:#0b7a45"></b>优于样例</span>
        <span><b style="background:#d92d20"></b>劣于样例</span>
        <span><b style="background:#94a3b8"></b>样例 ${base.time}（虚线）</span>
        ${useLog?`<span><b style="background:#cfd9e4"></b>纵轴对数刻度</span>`:""}
      </div>
    </div>`;
}

/* 版本差异卡 */
function renderVerDiff(c){
  if(!c.verCfg) return "";
  const idx = VERSIONS.findIndex(v=>v.id===state.version);
  const prev = idx>0 ? VERSIONS[idx-1] : null;
  const base = CASES.find(x=>x.id===state.id);
  const prevCfg = prev && prev.cfg ? {...JSON.parse(JSON.stringify(base.init)),
    ...(prev.cfg[state.id]||{})} : JSON.parse(JSON.stringify(base.init));
  const curCfg = c.verCfg;
  const rows = [];
  for(const k of ["V","P","D","K"]){
    if(prevCfg[k] !== curCfg[k])
      rows.push(`<div class="row"><span class="k">${k}</span>
        <span class="old">${prevCfg[k]}</span><span>→</span>
        <span class="new">${curCfg[k]}</span></div>`);
  }
  if(JSON.stringify(prevCfg.psi) !== JSON.stringify(curCfg.psi))
    rows.push(`<div class="row"><span class="k">ψ</span>
      <span class="old">[${prevCfg.psi.join(",")}]</span><span>→</span>
      <span class="new">[${curCfg.psi.join(",")}]</span></div>`);
  const changed = curCfg.map.map((r,l)=>
    JSON.stringify(r)!==JSON.stringify(prevCfg.map[l]) ? l : -1).filter(l=>l>=0);
  if(changed.length)
    rows.push(`<div class="row"><span class="k">MAP</span>
      <span class="old">层 ${changed.join(",")}</span><span>→</span>
      <span class="new">已重排</span></div>`);
  const pm = prev && prev.modes ? prev.modes.length : 0;
  const cm = c.verModes ? c.verModes.length : 0;
  if(cm !== pm && pm > 0)
    rows.push(`<div class="row"><span class="k">调度</span>
      <span class="old">${pm} 种优先级</span><span>→</span>
      <span class="new">${cm} 种</span></div>`);
  if(!rows.length) rows.push(`<div class="row" style="color:var(--faint)">
    映射与调度参数均未变</div>`);
  const prevTime = prev ? verCase(prev.id, state.id).time : base.time;
  const dt = c.time - prevTime;
  return `<div class="vdiffcard">
    <h2 style="margin:0 0 8px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
      color:var(--faint);font-weight:600">相对 ${prev?prev.id:"样例"} 的差异</h2>
    ${rows.join("")}
    <div class="row"><span class="k">Time</span>
      <span class="old">${prevTime}</span><span>→</span>
      <span class="new ${dt>0?"worse":""}">${c.time}${dt?` (${dt>0?"+":""}${dt})`:""}</span></div>
  </div>`;
}

/* Time 分解：瓶颈卡组的通信链 */
function renderTime(c){
  const g = c.engines.slice().sort((a,b)=> (b.mu-a.mu) || (b.commLast-a.commLast))[0];
  const cf = g.commFirst, cl = g.commLast;
  const lead = cf;                                  // 首个通信操作之前：填充
  const busy = g.comm;                              // 通信引擎忙
  const gap = Math.max(0, (cl-cf) - g.comm);        // 通信链内部空隙
  const tail = Math.max(0, c.time - cl);            // 最后一次通信之后：排空
  const T = c.time || 1;
  let acc = 0, bars = "";
  for(const [cls,v] of [["lead",lead],["busy",busy],["gap",gap],["tail",tail]]){
    if(v<=0) continue;
    bars += `<i class="${cls}" style="left:${acc}%;width:${100*v/T}%"></i>`;
    acc += 100*v/T;
  }
  document.getElementById("timepane").innerHTML = `
    <h3>Time 分解<span class="tag" style="margin-left:4px">瓶颈 v=${g.v} 通信链</span></h3>
    <div class="wf">${bars}</div>
    <div class="wfkey">
      <span><b style="background:#3b4a5e"></b>首串接 <em>${lead}</em></span>
      <span><b style="background:#2ea9bd"></b>通信忙 <em>${busy}</em></span>
      <span><b style="background:#1d2733"></b>链内空隙 <em>${gap}</em></span>
      <span><b style="background:#5c3a44"></b>尾排空 <em>${tail}</em></span>
    </div>`;
}

/* 底部面板：操作清单 / 运行记录 / 回归趋势 */
function renderBottom(c){
  const tabs = [["ops","操作清单"],["runs","运行记录"],["trend","回归趋势"]];
  document.getElementById("tabs3").innerHTML = tabs.map(([k,t])=>
    `<button data-t2="${k}" aria-selected="${state.tab2===k}">${t}</button>`).join("");

  else renderTrend(c);
}

/* 操作清单 */
function renderOps(c){
  const tabs = [["all","全部"],["comp","计算"],["comm","通信"],["zero","零时长"]];
  const f = state.olFilter || "all";
  document.getElementById("ftabs").innerHTML = tabs.map(([k,t])=>
    `<button class="ftab" data-f="${k}" aria-selected="${k===f}">${t}</button>`).join("");
  document.querySelectorAll(".ftab").forEach(b=>b.onclick=()=>{
    state.olFilter=b.dataset.f; renderList(c);
  });
  const rows = c.ops.filter(o=>
      f==="all" ? true : f==="zero" ? o.dur===0 : o.engine===f)
    .sort((a,b)=> a.t-b.t || a.mb-b.mb || a.l-b.l);
  document.getElementById("oplcnt").textContent =
    `${rows.length} / ${c.ops.length} ops`;
  const body = `<table class="opl">
    <colgroup><col style="width:56px"><col style="width:56px"><col style="width:56px">
      <col style="width:112px"><col style="width:62px"><col style="width:52px">
      <col style="width:46px"><col></colgroup>
    <thead><tr>
      <th>t</th><th>时长</th><th>结束</th><th>操作</th><th>mb:ℓ</th><th>引擎</th>
      <th>卡组</th><th>在时间轴上的位置</th>
    </tr></thead><tbody>${rows.map(o=>{
      const col = o.dur===0 ? "#94a3b4" : (o.engine==="comp"
        ? (ISBWD(o.op)?"var(--compb)":"var(--comp)")
        : (ISBWD(o.op)?"var(--commb)":"var(--comm)"));
      const sel = state.sel===selId(o) ? " sel" : "";
      return `<tr data-key="${o.key}" data-mb="${o.mb}" class="${sel.trim()}">
        <td class="n">${o.t}</td><td class="n">${o.dur}</td><td class="n">${o.end}</td>
        <td class="cellop"><span class="sw" style="background:${col}"></span>${o.op}</td>
        <td>${o.mb}:${o.l}</td><td>${o.engine==="comp"?"计算":"通信"}</td><td>v=${o.g}</td>
        <td><div class="pbar" title="${o.t} → ${o.end}">
          <i style="left:${100*o.t/c.time}%;width:${Math.max(0.6,100*o.dur/c.time)}%;
            background:${col}"></i></div></td></tr>`;
    }).join("")}</tbody></table>`;
  document.getElementById("oplbody").innerHTML = body;
  document.querySelectorAll("table.opl tbody tr").forEach(tr=>{
    tr.onclick = ()=>{ state.sel = tr.dataset.key+"#"+tr.dataset.mb; render(); };
  });
}

/* ---------------- 右栏 ---------------- */
function renderRight(c, ok){
  const el = document.getElementById("col-right");
  if(!ok){
    el.innerHTML = `
      ${renderVerDiff(c)}
      <div class="sect"><h2>问题列表<span class="tag">${c.errors.length} 条</span></h2>
        ${c.errors.map(e=>`<div class="err">
          <div class="t">${e.tok} · ${e.cls}</div>
          <div class="m">${e.msg}</div>
          <div class="fix">最小合法起点 ${e.fix.replace("最小合法起点 ","")}</div>
        </div>`).join("")}
        <div class="note">按题面 §5.2，该测试点记 0 分。时间轴上虚红框标出被改坏的条目。</div>
      </div>
      <div class="sect"><h2>操作检查器</h2>
        <div class="empty">选中一个操作<br>查看依赖解析与引擎占用</div></div>`;
    return;
  }
  if(!state.sel){
    el.innerHTML = `
      ${renderVerDiff(c)}
      <div class="sect"><h2>操作检查器<span class="tag">§4.2</span></h2>
        <div class="empty">点击时间轴上的任意操作块<br>或零时长的竖线</div>
      </div>
      <div class="sect"><h2>怎么读这张图</h2>
        <div class="howto">
          <div class="row"><div class="n">1</div><div class="t"><b>先看瓶颈引擎</b>
            <span>被色块填满的那条泳道就是上界</span></div></div>
          <div class="row"><div class="n">2</div><div class="t"><b>再看首尾串接</b>
            <span>底部把 Time 拆成首串接 + 通信忙 + 链内空隙 + 尾排空</span></div></div>
          <div class="row"><div class="n">3</div><div class="t"><b>激活泳道解释 Mact</b>
            <span>重叠越多峰越高，内存紧时要主动拉开</span></div></div>
          <div class="row"><div class="n">4</div><div class="t"><b>虚线是激活峰值时刻</b>
            <span>对应左栏 Mact 的计数依据</span></div></div>
        </div>
      </div>`;
    return;
  }
  const hash = state.sel.lastIndexOf("#");
  const key = state.sel.slice(0, hash), mb = +state.sel.slice(hash+1);
  const o = c.ops.find(x=>x.key===key && x.mb===mb);
  const L = c.scalars.L;
  const deps = PREDS(o.op,o.mb,o.l,L).map(([m,l,op])=>{
    const p = c.ops.find(x=>x.mb===m&&x.l===l&&x.op===op);
    if(!p) return "";
    const slack = o.t - p.end;
    return `<div class="dep"><span class="tm">${m}:${l}:${op}</span>
      <span class="arrow">→</span><span class="tm">${p.end}</span>
      <span class="${slack>=0?"ok":"bad"}">${slack>=0?`+${slack}`:`${slack}`}</span></div>`;
  }).join("") || `<div class="dep" style="color:var(--faint)">无前置 · 流水线起点</div>`;

  const same = c.ops.filter(x=>x.engine===o.engine&&x.g===o.g).sort((a,b)=>a.t-b.t);
  const idx = same.findIndex(x=>x.mb===o.mb&&x.l===o.l&&x.op===o.op);
  const prev = same[idx-1], next = same[idx+1];
  const waiters = c.ops.filter(x=>PREDS(x.op,x.mb,x.l,L)
    .some(([m,l,op])=>m===o.mb&&l===o.l&&op===o.op)).slice(0,4)
    .map(x=>`<div class="dep"><span class="tm">${x.mb}:${x.l}:${x.op}</span>
      <span class="arrow">t</span><span class="tm">${x.t}</span>
      <span class="${x.t>=o.end?"ok":"bad"}">${x.t>=o.end?"满足":"违规"}</span></div>`).join("");

  el.innerHTML = `
    <div class="head">
      <div class="tok">${o.mb}:${o.l}:${o.op}</div>
      <div class="meta">
        <span class="pill ${o.engine==="comp"?"comp":"comm"}">${
          o.engine==="comp"?"计算引擎":"通信引擎"}</span>
        <span class="pill grp">卡组 v=${o.g}</span>
        <span class="pill grp">${OPNAME[o.op]}</span>
      </div>
    </div>
    <div class="kv">
      <div class="k">开始</div><div class="v">${o.t}</div>
      <div class="k">时长</div><div class="v">${o.dur}${
        o.dur===0?` <small>· 零时长不占引擎</small>`:""}</div>
      <div class="k">结束</div><div class="v">${o.end}</div>
      <div class="k">引擎前序</div><div class="v">${
        prev?`${prev.mb}:${prev.l}:${prev.op} → ${prev.end}`:"—"}</div>
      <div class="k">引擎后序</div><div class="v">${
        next?`${next.mb}:${next.l}:${next.op} @${next.t}`:"—"}</div>
    </div>
    <div class="locate">
      <div class="b ${o.engine}" style="left:${100*o.t/c.time}%;width:${
        Math.max(1,100*o.dur/c.time)}%"></div>
      <div class="mk" style="left:${100*o.end/c.time}%"></div>
    </div>
    <div class="sect"><h2>依赖解析<span class="tag">结束时刻 · 余量</span></h2>${deps}</div>
    <div class="sect"><h2>被谁等待</h2>${
      waiters||`<div class="dep" style="color:var(--faint)">无</div>`}</div>
    <div class="sect"><h2>时长来源<span class="tag">§4.1</span></h2>
      <div class="note">${o.engine==="comp"
        ? (o.op.includes("gemm")
            ? "计算类依赖 m<sub>ℓ</sub> = max<sub>r</sub> Σ a<sub>ℓ,e</sub>：最慢 rank 决定整层。"
            : "计算类依赖 T<sub>ℓ</sub> 与本层系数。")
        : "通信类依赖 x<sub>ℓ</sub>，只由 T<sub>ℓ</sub> 决定，与负载偏斜无关。"}</div>
    </div>`;
}

/* ===================== 编辑映射：模型 + 贪心调度 + 弹层 ===================== */
const COMPOPS = new Set(["s","gemm","s_bwd","gemm_dx","gemm_dw","s_dw"]);
const FWDOPS = ["s","disp","gemm","comb"];
const BWDOPS = ["s_bwd","comb_bwd","gemm_dx","gemm_dw","disp_bwd","s_dw"];
const editor = {base:null, cfg:null, tab:"grid", preview:null, errs:[]};

const ceilD = (a,b) => (b>0 && a>0) ? Math.floor((a+b-1)/b) : 0;
const greedyCache = new Map();
function greedyBaseline(base){
  if(!greedyCache.has(base.id)) greedyCache.set(base.id, buildDraft(base, base.init));
  return greedyCache.get(base.id);
}
const sameCfg = (a,b) => JSON.stringify(a) === JSON.stringify(b);

function durationsFor(base, cfg){
  const sc = base.scalars, P = cfg.P;
  const H = Math.floor((sc.d*sc.b)/sc.k);
  const pin = (sc.S % P === 0) ? P-1 : sc.S-1;
  const pout = Math.max(0, P-1-pin);
  const durs = [];
  for(let l=0;l<base.L;l++){
    const ld = base.loads[l];
    const T = ld.reduce((a,b)=>a+b,0);
    const per = new Array(P).fill(0);
    for(let e=0;e<ld.length;e++) per[cfg.map[l][e]] += ld[e];
    const m = Math.max(...per);
    const X = ceilD(T*H*(P-1), P);
    const x = Math.max(ceilD(pin*X, sc.Bin), ceilD(pout*X, sc.Bout)) * sc.Fio;
    const s = T*sc.Fs, gemm = m*sc.Fin, ax = sc.alphaX, bx = sc.betaX;
    durs.push({s, disp:x, gemm, comb:x,
      s_bwd: ceilD(ax*s,1e6), comb_bwd: ceilD(ax*x,1e6),
      gemm_dx: ceilD(ax*m*sc.Fin,1e6), gemm_dw: ceilD(ax*bx*m*sc.Fin,1e12),
      disp_bwd: ceilD(ax*x,1e6), s_dw: ceilD(ax*bx*s,1e12),
      _m:m, _x:x, _T:T, _per:per});
  }
  const psi = [0, ...cfg.psi.map(Number), base.L];
  const g = new Array(base.L).fill(0);
  for(let k=0;k<cfg.K;k++){
    const gk = k < cfg.V ? k : 2*cfg.V-1-k;
    for(let l=psi[k]; l<psi[k+1]; l++) g[l] = gk;
  }
  return {durs, g, psi, H, pin, pout};
}

function makeOps(base, cfg, durs, g){
  const sc = base.scalars, ops = [];
  for(let mb=0;mb<sc.nmb;mb++)
    for(let l=0;l<base.L;l++)
      for(const op of FWDOPS.concat(BWDOPS)){
        const dur = durs[l][op];
        ops.push({t:0, mb, l, op, dur, g:g[l],
                  engine: COMPOPS.has(op) ? "comp" : "comm",
                  key: `${mb}:${l}:${op}`, end:0});
      }
  return ops;
}

function listSchedule(ops, L, mode){
  const idx = new Map(ops.map(o=>[o.key,o]));
  ops.forEach(o=>{ o.deps = PREDS(o.op,o.mb,o.l,L).map(([m,l,op])=>`${m}:${l}:${op}`)
                     .filter(k=>idx.has(k)); });
  const free = {}, done = new Set();
  let pend = ops.slice();
  const isF = o => o.op==="s"||o.op==="disp"||o.op==="gemm"||o.op==="comb";
  const prio = o=>{
    switch(mode){
      case 0: return isF(o) ? o.mb*1000 + o.l : 1e7 + o.mb*1000 + (L-o.l);
      case 1: return o.mb*1e6 + (isF(o)?0:1e3) + (o.op==="comb_bwd"?1:(o.op==="gemm_dw"||o.op==="s_dw"?2:0))*100 + o.l;
      case 2: return o.l*1000 + (isF(o)?0:1e6) + o.mb;
      case 3: return o.l*1e4 + (isF(o)?0:1e3) + o.mb;
      case 4: return (isF(o) ? (o.mb + o.l) : 1e3 + (o.mb + (L-1-o.l)))*10 + (isF(o)?0:1);
      default: return (isF(o)?0:1e6) + (o.mb*10 + o.l);
    }
  };
  while(pend.length){
    let best = null;
    for(const o of pend){
      if(o.deps.some(d=>!done.has(d))) continue;
      const ready = o.deps.reduce((mx,d)=>Math.max(mx, idx.get(d).end), 0);
      const start = o.dur === 0 ? ready
        : Math.max(ready, free[o.g+"|"+o.engine] || 0);
      const p = prio(o);
      if(!best || start < best.start || (start === best.start && p < best.p)) best = {o,start,p};
    }
    if(!best) break;
    const o = best.o;
    o.t = o.start = best.start; o.end = o.start + o.dur;
    if(o.dur > 0) free[o.g+"|"+o.engine] = o.end;
    done.add(o.key);
    pend.splice(pend.indexOf(o),1);
  }
  return ops;
}

function peakSpans(spans, closed){
  if(!spans.length) return [0,null];
  const marks = [...new Set(spans.flat())].sort((a,b)=>a-b);
  let best = 0, at = null;
  for(const t of marks){
    let c = 0;
    for(const [s,e] of spans) if(closed ? (s<=t && t<=e) : (s<=t && t<e)) c++;
    if(c > best){ best = c; at = t; }
  }
  return [best, at];
}

function buildDraft(base, cfg, modes){
  const {durs, g} = durationsFor(base, cfg);
  const proto = makeOps(base, cfg, durs, g);
  let bestOps = null, bestTime = Infinity;
  const modeList = modes && modes.length ? modes : [0,1,2,3,4,5];
  for(const mode of modeList){
    const trial = proto.map(o=>({...o}));
    listSchedule(trial, base.L, mode);
    const t = Math.max(0, ...trial.map(o=>o.end));
    if(t < bestTime){ bestTime = t; bestOps = trial; }
  }
  const sc = base.scalars;
  const time = bestTime;
  const engines = [];
  const perGroupLayers = Array.from({length:cfg.V}, ()=>[]);
  for(let l=0;l<base.L;l++) perGroupLayers[g[l]].push(l);
  for(let v=0;v<cfg.V;v++){
    let comp = 0, comm = 0, cf = null, cl = null;
    for(const o of bestOps){
      if(o.g !== v) continue;
      if(o.engine === "comp") comp += o.dur;
      else { comm += o.dur; cf = cf===null?o.t:Math.min(cf,o.t);
             cl = cl===null?o.end:Math.max(cl,o.end); }
    }
    engines.push({v, comp, comm, cu: time?comp/time:0, mu: time?comm/time:0,
                  commFirst:cf, commLast:cl, first:cf, last:cl});
  }
  const memOf = closed => engines.map(e=>{
    const layers = perGroupLayers[e.v];
    const mexp = layers.length*((sc.E/cfg.P)*sc.Z + sc.Zs);
    const commSpans = bestOps.filter(o=>o.g===e.v && o.engine==="comm").map(o=>[o.t,o.end]);
    const actSpans = [];
    for(let mb=0;mb<sc.nmb;mb++) for(const l of layers){
      const comb = bestOps.find(o=>o.mb===mb && o.l===l && o.op==="comb");
      const sb = bestOps.find(o=>o.mb===mb && o.l===l && o.op==="s_bwd");
      if(comb && sb) actSpans.push([comb.end, sb.t]);
    }
    const [cp,cpat] = peakSpans(commSpans, closed);
    const [ap,apat] = peakSpans(actSpans, closed);
    const movl = sc.U*cp, mact = sc.Uact*ap;
    return {v:e.v, layers, mexp, movl, mact, total:mexp+movl+mact, limit:sc.M,
            commPeak:cp, commPeakAt:cpat, actPeak:ap, actPeakAt:apat};
  });
  let lb = 0;
  for(let v=0;v<cfg.V;v++){
    let c = 0, m = 0;
    for(const l of perGroupLayers[v]) for(const op of FWDOPS.concat(BWDOPS)){
      if(COMPOPS.has(op)) c += durs[l][op]; else m += durs[l][op];
    }
    lb = Math.max(lb, sc.nmb*Math.max(c,m));
  }
  return {
    id:"draft", title:"草稿映射", subtitle:"贪心调度",
    scalars:{...sc, V:cfg.V, P:cfg.P, D:cfg.D},
    L:base.L,
    groups: perGroupLayers.map((ls,i)=>({v:i, layers:ls})),
    ops: bestOps, time, lb,
    expected: base.time, expectedSrc: "样例",
    memory: memOf(true), memoryOpen: memOf(false), engines,
    durations: durs.map((d,l)=>({l, d})),
    loads: base.loads, init: JSON.parse(JSON.stringify(cfg)), draft: true
  };
}

function validateCfg(base, cfg){
  const sc = base.scalars, errs = [];
  const R = sc.N*sc.S;
  if(cfg.V*cfg.P*cfg.D !== R) errs.push(`V·P·D = ${cfg.V*cfg.P*cfg.D} ≠ R = ${R}`);
  if(sc.E % cfg.P !== 0) errs.push(`P = ${cfg.P} 不整除 E = ${sc.E}`);
  if(!(sc.S % cfg.P === 0 || cfg.P % sc.S === 0))
    errs.push(`EP 组无法与节点对齐（P=${cfg.P}, S=${sc.S}）`);
  if(!(cfg.K === cfg.V || cfg.K === 2*cfg.V))
    errs.push(`K = ${cfg.K} 必须等于 V=${cfg.V} 或 2V=${2*cfg.V}`);
  if(cfg.K > base.L) errs.push(`K = ${cfg.K} 块需要至少 ${cfg.K} 层，但 L = ${base.L}`);
  if(cfg.psi.length !== cfg.K-1) errs.push(`切点应为 K−1 = ${cfg.K-1} 个`);
  let prev = 0;
  for(const p of cfg.psi.map(Number)){
    if(!(p > prev && p < base.L)) errs.push(`切点 ${p} 非法：需严格递增且 0 < ψ < ${base.L}`);
    prev = p;
  }
  const cap = sc.E/cfg.P;
  for(let l=0;l<base.L;l++){
    const cnt = new Array(cfg.P).fill(0);
    for(const r of cfg.map[l]) cnt[r] += 1;
    if(cnt.some(c=>c !== cap))
      errs.push(`层 ${l} 每 rank 需恰好 ${cap} 个专家，实际 ${cnt.join("/")}`);
  }
  return errs;
}
