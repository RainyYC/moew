  document.getElementById("sheet").classList.remove("on");
}
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function stepper(key, label, val, extra){
  return `<div class="frow"><span class="flabel">${label}</span>
    <div class="stepper">
      <button data-step="${key}:-1">−</button>
      <input type="number" min="1" max="512" value="${val}" data-key="${key}">
      <button data-step="${key}:1">+</button>
      <span class="eqn">${extra||""}</span>
    </div></div>`;
}

function gridPane(base, cfg){
  const sc = base.scalars, R = sc.N*sc.S;
  const prod = cfg.V*cfg.P*cfg.D;
  const ok = (c, t) => `<i class="${c?'ok':'bad'}">${c?'✓':'✗'} ${t}</i>`;
  return `
    ${stepper("V","stage 数 V",cfg.V,`每 stage 约 ${(base.L/cfg.V).toFixed(1)} 层`)}
    ${stepper("P","专家并行 P",cfg.P,`每 rank ${sc.E/cfg.P} 个专家`)}
    ${stepper("D","数据并行 D",cfg.D,`nmb 每副本 ${sc.nmb/cfg.D}`)}
    <div class="frow"><span class="flabel">约束</span>
      <div class="chks">
        ${ok(prod===R, `V·P·D = ${prod} = R = ${R}`)}
        ${ok(sc.E % cfg.P === 0, `P ∣ E（${cfg.P} ∣ ${sc.E}）`)}
        ${ok(sc.S % cfg.P === 0 || cfg.P % sc.S === 0, `P 与 S=${sc.S} 对齐（pin/pout 可算）`)}
      </div></div>
    <div class="frow"><span class="flabel">推导</span>
      <div class="chks">${editor.model ? `
        <i>H = ⌊d·b/k⌋ = ${editor.model.H}</i>
        <i>pin = ${editor.model.pin} · pout = ${editor.model.pout}</i>
        <i>每卡组 Mexp = ${(base.L/cfg.V*((sc.E/cfg.P)*sc.Z+sc.Zs)).toFixed(0)}</i>` :
        `<i class="bad">先修正上述约束</i>`}</div></div>
    <div class="frow"><span class="flabel">每层量</span>
      <div class="chks">${editor.model ? editor.model.durs.map((d,l)=>
        `<i>ℓ${l}: m=${d._m} gemm=${d.gemm} x=${d._x}</i>`).join("") : "—"}</div></div>
    <div class="frow"><span class="flabel">说明</span>
      <div class="eqn">P 决定每卡专家数与 AllToAll 对端分布；V 决定共卡层数与流水线深度；D 只复制不改结构。</div></div>`;
}

function psiPane(base, cfg){
  const K = cfg.K;
  const lenOk = cfg.psi.length === K-1;
  const psi = [0, ...cfg.psi.map(Number), base.L];
  const rows = [];
  for(let k=0;k<K;k++){
    const gk = k < cfg.V ? k : 2*cfg.V-1-k;
    const n = psi[k+1]-psi[k];
    rows.push(`<div class="maprow"><span class="ly">块 ${k}</span>
      <span>层 ${psi[k]}…${psi[k+1]-1}</span>
      <span style="color:var(--faint)">· ${n} 层 · 卡组 v=${gk}</span></div>`);
  }
  const cutInputs = cfg.psi.map((p,i)=>
    `<span class="cut">ψ${i+1}<input type="number" min="1" max="${base.L-1}"
      value="${p}" data-cut="${i}" class="${p>0&&p<base.L?'':'bad'}"></span>`).join("");
  return `
    <div class="frow"><span class="flabel">块数 K</span>
      <div class="kbtn">
        <button data-k="${cfg.V}" aria-selected="${cfg.K===cfg.V}">K = V = ${cfg.V}</button>
        <button data-k="${2*cfg.V}" aria-selected="${cfg.K===2*cfg.V}"
          ${base.L < 2*cfg.V ? 'disabled title="每块至少 1 层，L='+base.L+' 不够切 '+2*cfg.V+' 块" style="opacity:.45"' : ''}>
          K = 2V = ${2*cfg.V}</button>
      </div>
      <span class="eqn">${base.L < 2*cfg.V ? `L=${base.L} 层不足以切成 ${2*cfg.V} 块` : ""}</span></div>
    <div class="frow"><span class="flabel">切点 ψ</span>
      <div class="cuts">${cfg.K===1 ? `<span class="eqn">K=1 不需要切点</span>` : cutInputs}
        <div class="quick"><button data-act="even">均分切点</button></div></div></div>
    ${lenOk ? `<div class="mapwrap">${rows.join("")}</div>` :
      `<div class="mapwrap"><div class="empty" style="padding:16px">切点数量应为 K−1 = ${K-1} 个，
        当前 ${cfg.psi.length} 个 —— 补齐后才能预览分块</div></div>`}
    <div class="frow" style="margin-top:10px"><span class="flabel">每卡组</span>
      <div class="chks">${Array.from({length:cfg.V},(_,v)=>{
        let n=0;
        if(lenOk) for(let k=0;k<K;k++){ const gk=k<cfg.V?k:2*cfg.V-1-k;
          if(gk===v) n += psi[k+1]-psi[k]; }
        if(!lenOk) return `<i>v=${v}: —</i>`;
        const mexp = n*((base.scalars.E/cfg.P)*base.scalars.Z + base.scalars.Zs);
        return `<i>v=${v}: ${n} 层, Mexp ${mexp}${mexp>base.scalars.M?' ⚠超限':''}</i>`;
      }).join("")}</div></div>
    <div class="note" style="margin-top:6px">K=2V 时每卡组持两块（镜像配对），
      前向与反向可同时占用两处参数；代价是每卡 Mexp 翻倍。</div>`;
}

function mapPane(base, cfg){
  const sc = base.scalars, cap = sc.E/cfg.P;
  const rankHue = r => `hsl(${205 + r*52}, 52%, ${r===0?93:88}%)`;
  const rows = [];
  for(let l=0;l<base.L;l++){
    const cnt = new Array(cfg.P).fill(0), slots = new Array(cfg.P).fill(0);
    cfg.map[l].forEach((r,e)=>{ cnt[r]+=1; slots[r]+=base.loads[l][e]; });
    const m = Math.max(...slots);
    const cells = cfg.map[l].map((r,e)=>
      `<button class="cellr" data-cell="${l}:${e}"
        style="background:${rankHue(r)}" title="层 ${l} 专家 ${e}（负载 ${base.loads[l][e]}）→ rank ${r}">${r}</button>`).join("");
    const cntTxt = cnt.map((c,r)=>
      `<span class="${c===cap?'b':'w'}">r${r} ${c}个·Σ${slots[r]}</span>`).join("");
    rows.push(`<div class="maprow"><span class="ly">ℓ${l}</span>
      <div class="cells">${cells}</div>
      <div class="cnt">${cntTxt}
        <span style="color:var(--dim)">m=${m} · gemm ${m*base.scalars.Fin}</span></div></div>`);
  }
  return `
    <div class="frow"><span class="flabel">每 rank 容量</span>
      <div class="eqn">E/P = ${cap} 个专家 · 点格子切到下一个 rank（右键回退）· 右列为
        “该 rank 专家数·槽数和”</div></div>
    <div class="mapwrap">${rows.join("")}</div>
    <div class="frow" style="margin-top:10px"><span class="flabel">负载</span>
      <div class="eqn">${base.loads.map((ld,l)=>`ℓ${l}: [${ld.join(", ")}]`).join("　")}</div></div>
    <div class="frow"><span class="flabel">快捷</span>
      <div class="quick"><button data-act="lpt">按负载重排（LPT）</button>
        <button data-act="seq">顺序放置</button></div></div>`;
}

function renderEditor(){
  const base = editor.base, cfg = editor.cfg, sc = base.scalars;
  document.getElementById("sheet-sub").textContent =
    `${base.id} · R=${sc.N*sc.S} · E=${sc.E} · L=${base.L} · nmb=${sc.nmb} · S=${sc.S}`;
  const tabs = [["grid","网格 V/P/D"],["psi","切层 PSI"],["map","专家放置 MAP"]];
  document.getElementById("sheet-tabs").innerHTML = tabs.map(([k,t])=>
    `<button data-t="${k}" aria-selected="${editor.tab===k}">${t}</button>`).join("");
  document.querySelectorAll("#sheet-tabs button").forEach(b=>{
    b.onclick = ()=>{ editor.tab = b.dataset.t; renderEditor(); };
  });
  const errs = validateCfg(base, cfg);
  editor.errs = errs;
  editor.model = errs.length ? null : durationsFor(base, cfg);
  const body = document.getElementById("sheet-body");
  body.innerHTML = editor.tab==="grid" ? gridPane(base,cfg)
                 : editor.tab==="psi" ? psiPane(base,cfg)
                 : mapPane(base,cfg);
  bindEditor();

  const pv = document.getElementById("sheet-pv");
  if(errs.length){
    editor.preview = null;
    pv.innerHTML = `<span class="bad">✗ 映射不合法（${errs.length} 处）</span>
      <span class="sep">·</span><span>${esc(errs[0])}</span>`;
  } else {
    const bl = greedyBaseline(base);
    const d = buildDraft(base, cfg);
    editor.preview = d;
    const fmt = (v, ref) => {
      const dv = v - ref;
      if(dv === 0) return `<b>${v}</b>`;
      return `<b>${v}</b><span class="${dv<0?'good':'bad'}">（${dv>0?"+":""}${dv}）</span>`;
    };
    const memMax = Math.max(...d.memory.map(m=>m.total));
    const blMem = Math.max(...bl.memory.map(m=>m.total));
    const memOk = memMax <= sc.M;
    const bottleneck = d.engines.reduce((a,b)=> (b.mu>b.cu?b:a));
    pv.innerHTML = `<span class="good">✓ 合法</span><span class="sep">·</span>
      <span>下界 ${fmt(d.lb, bl.lb)}</span><span class="sep">·</span>
      <span>贪心 ${fmt(d.time, bl.time)}</span><span class="sep">·</span>
      <span class="${memOk?"":"bad"}">峰值内存 ${fmt(memMax, blMem)}/${sc.M}</span>
      <span class="sep">·</span><span>瓶颈 v=${bottleneck.v} ${
        bottleneck.mu>=bottleneck.cu?"通信"+Math.round(bottleneck.mu*100)+"%":
        "计算"+Math.round(bottleneck.cu*100)+"%"}</span>
      <span class="hint">贪心调度只用于同口径横向比较（样例用的是手工调度）；
        绝对最优 Time 交给求解器。</span>`;
  }
  const ap = document.getElementById("sheet-apply");
  ap.disabled = errs.length > 0;
  ap.style.opacity = errs.length ? .45 : 1;
}

function bindEditor(){
  const cfg = editor.cfg, base = editor.base;
  document.querySelectorAll("[data-step]").forEach(b=>{
    b.onclick = ()=>{
      const [k,dv] = b.dataset.step.split(":");
      cfg[k] = Math.max(1, Math.min(512, cfg[k] + Number(dv)));
      if(k==="V"){ if(cfg.K!==cfg.V && cfg.K!==2*cfg.V) cfg.K = cfg.V; }
      if(k==="P" && base.scalars.E % cfg.P !== 0) cfg.P = cfg.P;
      if(cfg.K===2*cfg.V && !cfg.psi.length) cfg.psi = [Math.floor(base.L/2)];
      if(cfg.K===cfg.V) cfg.psi = [];
      renderEditor();
    };
  });
  document.querySelectorAll("input[data-key]").forEach(inp=>{
    inp.onchange = ()=>{
      const k = inp.dataset.key;
      cfg[k] = Math.max(1, Math.min(512, Number(inp.value)||1));
      if(k==="V"){ cfg.K = (cfg.K===2*cfg.V)?2*cfg.V:cfg.V;
        if(cfg.K===cfg.V) cfg.psi=[]; else if(!cfg.psi.length) cfg.psi=[Math.floor(base.L/2)]; }
      renderEditor();
    };
  });
  document.querySelectorAll("input[data-cut]").forEach(inp=>{
    inp.onchange = ()=>{
      const i = +inp.dataset.cut;
      cfg.psi[i] = Number(inp.value)||1;
      renderEditor();
    };
  });
  document.querySelectorAll("button[data-k]").forEach(b=>{
    b.onclick = ()=>{
      cfg.K = +b.dataset.k;
      cfg.psi = cfg.K===1 ? []
        : Array.from({length:cfg.K-1}, (_,i)=>Math.round((i+1)*base.L/cfg.K));
      renderEditor();
    };
  });
  document.querySelectorAll("button[data-cell]").forEach(b=>{
    const [l,e] = b.dataset.cell.split(":").map(Number);
    const step = ev => {
      ev.preventDefault();
      const dir = ev.button === 2 ? -1 : 1;
      cfg.map[l][e] = ((cfg.map[l][e] + dir) % cfg.P + cfg.P) % cfg.P;
      renderEditor();
    };
    b.onclick = step;
    b.oncontextmenu = step;
  });
  document.querySelectorAll("button[data-act]").forEach(b=>{
    b.onclick = ()=>{
      const act = b.dataset.act;
      if(act==="even"){
        cfg.psi = Array.from({length:cfg.K-1}, (_,i)=>Math.round((i+1)*base.L/cfg.K));
      } else if(act==="lpt" || act==="seq"){
        const cap = base.scalars.E/cfg.P;
        cfg.map = base.loads.map(ld=>{
          if(act==="seq") return ld.map((_,e)=>Math.floor(e/cap));
          const order = ld.map((v,e)=>[v,e]).sort((a,b)=>b[0]-a[0]);
          const per = new Array(cfg.P).fill(0), cnt = new Array(cfg.P).fill(0);
          const row = new Array(ld.length);
          for(const [v,e] of order){
            let pick = -1;
            for(let r=0;r<cfg.P;r++){
              if(cnt[r] >= cap) continue;
              if(pick<0 || per[r] < per[pick] ||
                 (per[r] === per[pick] && cnt[r] < cnt[pick])) pick = r;
            }
            if(pick < 0) pick = 0;
            row[e] = pick; per[pick] += v; cnt[pick] += 1;
          }
          return row;
        });
      }
      renderEditor();
    };
  });
}

document.getElementById("btn-edit").onclick = openEditor;
document.getElementById("mask").onclick = closeEditor;
document.getElementById("sheet-close").onclick = closeEditor;
document.getElementById("sheet-cancel").onclick = closeEditor;
document.getElementById("sheet-reset").onclick = ()=>{
  editor.cfg = JSON.parse(JSON.stringify(editor.base.init));
  editor.cfg.psi = (editor.cfg.psi||[]).map(Number);
  renderEditor();
};
document.getElementById("sheet-apply").onclick = ()=>{
  if(editor.errs.length) return;
  if(sameCfg(editor.cfg, editor.base.init)){
    state.version = "v0.1";
  } else {
    const k = VERSIONS.filter(v=>v.local).length + 1;
    const id = `m${k}`;
    VERSIONS.push({id, local:true, commit:"local",
      label:`手调映射 ${k}`, note:`由编辑器生成（${state.id}）`,
      cfg:{[state.id]: JSON.parse(JSON.stringify(editor.cfg))}});
    state.version = id;
  }
  state.sel = null; state.illegal = false;
  document.getElementById("btn-illegal").textContent = "注入非法调度";
  closeEditor();
  render();
};

/* 版本下拉 */
function renderVerPop(){
  const pop = document.getElementById("vpop");
  const base = CASES.find(c=>c.id===state.id);
  const rows = VERSIONS.map((v,i)=>{
    const sc2 = relScore(v.id);
    const rank = sc2===null ? "—" : (scores.findIndex(x=>x.id===v.id)+1);
    const relCls = sc2===null ? "" : (sc2<0.999 ? "good" : (sc2>1.001 ? "bad" : "base"));
    const relTxt = sc2===null ? "非法" : (sc2===1 ? "1.000" : sc2.toFixed(3));
    const star = rank===1 ? " ★" : "";
    const r = verRow(v.id, state.id);
    const prev = i>0 ? verRow(VERSIONS[i-1].id, state.id) : null;
    const d = prev && prev.ok && r.ok ? r.time - prev.time : null;
    const dd = d===null || d===0 ? "" :
      `<span class="dl ${d>0?"bad":"good"}">${d>0?"+":""}${d}</span>`;
    return `<div class="vrow ${v.id===state.version?"cur":""}" data-v="${v.id}">
      <span>${v.id}</span>
      <span class="nm">${v.label}</span>
      <span class="tm">${r.ok?r.time:"非 法"}</span>${dd}</div>`;
  }).join("");
  pop.innerHTML = `<div class="vh"><b>版本历史</b>
      <span>· ${state.id} · 共 ${VERSIONS.length} 个</span>
      <span style="margin-left:auto;font-family:var(--mono)">样例 ${base.time}</span></div>${rows}`;
  pop.querySelectorAll(".vrow").forEach(el=>{
    el.onclick = ()=>{ state.version = el.dataset.v; state.sel=null;
      pop.classList.remove("on"); render(); };
  });
}
document.getElementById("verbtn").onclick = e=>{
  e.stopPropagation();
  const pop = document.getElementById("vpop");
  if(pop.classList.contains("on")) { pop.classList.remove("on"); return; }
  renderVerPop();
  const r = e.currentTarget.getBoundingClientRect();
  pop.style.left = Math.max(12, r.left - 180) + "px";
  pop.style.top = (r.bottom + 6) + "px";
  pop.classList.add("on");
};
document.addEventListener("click", e=>{
  const pop = document.getElementById("vpop");
  if(pop.classList.contains("on") && !pop.contains(e.target)) pop.classList.remove("on");
});
document.addEventListener("keydown", e=>{
  if(e.key === "Escape") closeEditor();
});

function render(){
  const base = cur();
  const c = state.illegal ? illegalCase(base) : base;
  const ok = !state.illegal;
  renderTop(c, ok); renderLeft(c, ok); renderGantt(c, ok);
  renderBottom(c); renderTime(c); renderRight(c, ok);
  document.getElementById("foot-state").textContent =
    `${c.id} · ${c.ops.length} ops · ${c.groups.length} 卡组 · 口径 ${
      state.mem==="closed"?"闭区间":"半开区间"} · 模拟 1 次`;
}
render();
</script>
